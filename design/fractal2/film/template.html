<head>

<meta name="theme-color" content="#05070d">

<style>
@font-face{font-family:"Voice";src:url(%%V9%%instrument.ttf) format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Voice";src:url(%%V9%%instrument-italic.ttf) format("truetype");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"Source Serif";src:url(%%V8%%fonts/sourceserif4.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
:root{--bg:#05070d;--ink:#F3ECD9;--ink2:#CFC8B6;--gold:#E9C27A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{font-family:"Source Serif",Georgia,serif;overscroll-behavior:none;touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100svh;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none}
#gl{position:absolute;left:0;top:0;display:block}
#pool{position:absolute;left:0;right:0;top:54%;bottom:0;opacity:0;pointer-events:none;background:linear-gradient(to bottom,rgba(3,4,8,0),rgba(3,4,8,.74) 36%,rgba(3,4,8,.88))}
.cap{position:absolute;left:50%;top:76%;width:min(88vw,30em);margin:0;text-align:center;font-family:"Voice",Georgia,serif;font-weight:400;font-size:clamp(1.7rem,6.6vw,2.7rem);line-height:1.16;letter-spacing:-.005em;color:var(--ink);opacity:0;transform:translate3d(-50%,0,0);pointer-events:none;text-wrap:balance;text-shadow:0 1px 18px rgba(3,4,8,.9)}
.cap .g{display:inline-block;opacity:0;white-space:pre-wrap}
.cap.big{font-size:clamp(2.3rem,9.6vw,4.4rem);line-height:1.06;top:74%}
.cap.acct{font-size:clamp(1.22rem,4.7vw,1.9rem);line-height:1.28;width:min(90vw,32em)}
.cap{margin-top:0;translate:0 -50%}
@media (min-aspect-ratio:1/1){.cap{top:86%;font-size:clamp(1.7rem,3.3vw,2.9rem);width:min(74vw,30em)}.cap.big{top:85%;font-size:clamp(2.2rem,4.4vw,4rem)}.cap.acct{font-size:clamp(1.2rem,2.1vw,1.9rem);width:min(70vw,34em)}#pool{top:66%}}
/* entry */
#entry{position:absolute;left:0;right:0;top:calc(var(--cy,40%) + var(--ts,80px) * .62);display:flex;flex-direction:column;align-items:center;gap:0;transition:opacity .28s ease-out;z-index:3}
#entry .sub{margin:0;font:400 clamp(.78rem,3.2vw,.95rem)/1 "Source Serif",Georgia,serif;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:var(--gold)}
#begin{margin:clamp(26px,6.5vh,64px) 0 0;width:clamp(84px,22vw,112px);height:clamp(84px,22vw,112px);padding:0;border:0;border-radius:50%;background:rgba(5,7,13,.5);color:var(--ink);cursor:pointer;position:relative;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s}
#begin svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#begin .trk{fill:none;stroke:rgba(233,194,122,.22);stroke-width:1.2}
#ring{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s ease-out}
#begin .tri{fill:var(--ink);opacity:.35;transition:opacity .4s}
html.ready #begin .tri{opacity:1}
html.ready #begin .trk{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@media (hover:hover){html.ready #begin:hover{transform:scale(1.06);background:rgba(233,194,122,.10)}}
#begin:active{transform:scale(.96)}
#begin:focus-visible,.lnk:focus-visible,.cbtn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#foot{position:absolute;left:0;right:0;bottom:0;padding:64px 0 calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;background:linear-gradient(to bottom,rgba(5,7,13,0),rgba(5,7,13,.86) 55%,rgba(5,7,13,.96));transition:opacity .28s ease-out;z-index:3}
html[data-mode=film] #foot{opacity:0;pointer-events:none}
#foot .meta{margin:0;font:400 .82rem/1.4 "Source Serif",Georgia,serif;color:var(--ink2);letter-spacing:.04em}
.lnk{margin-top:2px;font:400 .8rem/1 "Source Serif",Georgia,serif;color:var(--ink2);text-decoration:underline;text-decoration-color:rgba(207,200,182,.4);text-underline-offset:4px;padding:10px 12px}
html[data-mode=film] #entry{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){html.ready #begin .trk{animation:none}}
/* controls */
#ctl{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
html[data-mode=film].ui #ctl,html[data-mode=film].paused #ctl{opacity:1;pointer-events:auto}
.cbtn{min-width:44px;height:44px;border:0;background:transparent;color:var(--ink);font:400 .8rem/1 "Source Serif",Georgia,serif;letter-spacing:.06em;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:22px}
.cbtn svg{width:18px;height:18px;fill:currentColor}
#pp .pl{display:none}html.paused #pp .pl{display:block}html.paused #pp .pa{display:none}
#ctl .sp{flex:1}
#prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(243,236,217,.10);opacity:0;transition:opacity .35s;z-index:4}
html[data-mode=film] #prog{opacity:1}
#bar{position:absolute;inset:0;background:var(--gold);transform-origin:0 50%;transform:scaleX(0)}
#prog i{position:absolute;top:-2px;width:1px;height:6px;background:rgba(243,236,217,.35)}
#end{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:16vh;z-index:5}
html.ended #end{display:flex}
.door{font:400 1rem/1 "Source Serif",Georgia,serif;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#0b0d14;background:var(--gold);padding:18px 30px;border-radius:40px;text-decoration:none}
#hud{position:absolute;left:8px;top:8px;margin:0;padding:8px 10px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#9fe;background:rgba(0,0,0,.6);z-index:9;white-space:pre;pointer-events:none}
/* the whole script as text */
#text{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:20;display:none;padding:56px 22px 80px}
#text:target{display:block}
#text .in{max-width:34em;margin:0 auto;font-size:1.08rem;line-height:1.62}
#text h2{font-family:"Voice",Georgia,serif;font-weight:400;font-size:1.9rem;margin:2.2em 0 .5em;color:var(--gold)}
#text h3{font:400 .8rem/1 "Source Serif",Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2);margin:2.6em 0 1em}
#text p{margin:0 0 .85em}
#text .x{position:fixed;right:14px;top:10px;background:rgba(5,7,13,.9)}
html.capture *{transition:none!important;animation:none!important}
</style>
</head>
<body>
<h1 class="sr">Fractal²: begin here. A film by Shae Stovell.</h1>
<div id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="pool" aria-hidden="true"></div>
  <p class="cap" id="capA" aria-hidden="true"></p>
  <p class="cap" id="capB" aria-hidden="true"></p>
  <div id="entry">
    <p class="sub">Begin here</p>
    <button id="begin" type="button" aria-label="Begin the film"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="45"/><circle id="ring" cx="50" cy="50" r="45"/><path class="tri" d="M42 33 L69 50 L42 67Z"/></svg></button>
  </div>
  <div id="foot"><p class="meta">A twelve-minute film</p><a class="lnk" href="#text">Read it instead</a></div>
  <div id="prog" aria-hidden="true"><div id="bar"></div>%%TICKS%%</div>
  <div id="ctl">
    <button class="cbtn" id="pp" type="button" aria-label="Pause" aria-pressed="true"><svg class="pa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg><svg class="pl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
    <button class="cbtn" id="replay" type="button">Replay</button>
    <span class="sp"></span>
    <a class="cbtn" href="#text">Read</a>
    <a class="cbtn" href="%%HUB%%">Skip to the map</a>
  </div>
  <div id="end"><a class="door" href="%%HUB%%">Enter the map</a></div>
  <pre id="hud" hidden></pre>
</div>
<section id="text" aria-label="The film as text"><a class="cbtn x" href="#">Close</a><div class="in">
<h2>Fractal²</h2>
%%TEXT%%
</div></section>

F.boot();vars();addEventListener('resize',function(){setTimeout(vars,160)});
d.getElementById('begin').addEventListener('click',function(){var r=this.getBoundingClientRect(),m=F.dims();F.shots.rip=[(r.left+r.width/2-m.W/2)/m.U,(m.H*m.CYF-(r.top+r.height/2))/m.U]},true);})();</script>
