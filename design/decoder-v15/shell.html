(function(){var r=document.documentElement;try{var t=localStorage.getItem("ui-state");if(!t)return;var a=atob(t),k=[110,102,33,154,60,81],u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i)^k[i%6];
var o=JSON.parse(new TextDecoder().decode(u));if(!o||o.on!==1)return;if(o.th==="night"||o.th==="day")r.setAttribute("data-theme",o.th);if(o.sz==="l"||o.sz==="xl")r.setAttribute("data-size",o.sz);
if(o.sp==="roomy")r.setAttribute("data-space","roomy");if(o.mo==="reduce")r.setAttribute("data-motion","reduce");}catch(e){}})();</script>

<!--
THESIS: Wayfinding. A frightened reader gets the sign system of a metro at night, not a gallery: ten lettered lines, stations, "change here for", a green exit. Refuses the support-site pastel and v14's moving sky.
OWN-WORLD: near-black sign panels, enamel-white lettering, ten line colours each with a letter bullet, ISO amber for danger only, exit green for leaving only; Overpass 800 sign lettering over Atkinson Hyperlegible Next; rectangles for signs, circles for lines; nothing moves unprompted.
STORY: the reader understands where they are and where to go, believes nothing is saved or judged, and acts: names it, checks it both ways, finds a safe step, or leaves.
FIRST VIEWPORT: headline "Put a name to what is happening." at 36px; three sign blades, the white "Help me figure it out" first; the ten-line index below; Private status and green Leave in the top bar; four doors along the thumb.
FORM: Wayfinding (A of three compared in docs/DECODER-V15-ARCHITECTURE.html; seed 2e781f06, mode read).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
