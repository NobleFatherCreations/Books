<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Noble Father Creations</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080e">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
:root{color-scheme:dark light;
  --ink-0:#08080e; --ink-1:#0e0e19; --ink-3:#221f3d; --royal:#2e1a52;
  --mint:#2bf5c0; --mint-ink:#04120e; --gold:#f5c542;
  --paper:#f3f2f8; --paper-2:#b3afc9;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:light){
  :root{--ink-0:#f7f5f2; --ink-1:#fff; --ink-3:#ddd7ea; --royal:#e7e0f5;
        --mint:#0b7d64; --mint-ink:#fff; --gold:#8a6410;
        --paper:#14121c; --paper-2:#4a455c}}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center;
  background:var(--ink-0); color:var(--paper); font:400 17px/1.65 var(--sans);
  padding:2rem 1.25rem; text-align:center}
.seal{width:112px;height:112px;margin:0 auto 1.6rem;display:block}
h1{font-family:var(--serif); font-size:clamp(1.9rem,7vw,3rem); margin:0 0 .4rem; line-height:1.15}
h1 .a{color:var(--mint)}
p{color:var(--paper-2); max-width:32rem; margin:0 auto 1.8rem; font-size:1.02rem}
.mark{font-family:var(--serif); text-transform:uppercase; letter-spacing:.02em;
  font-size:1.05rem; margin:0 0 .35rem}
.mark .n{color:var(--gold)}
.tag{font:600 12.4px/1.5 var(--sans); letter-spacing:.2em; text-transform:uppercase;
  color:var(--mint); margin:0 0 2rem}
.btn{display:inline-flex; align-items:center; gap:.5rem; min-height:44px;
  padding:.78rem 1.5rem; border-radius:999px; text-decoration:none;
  background:var(--mint); color:var(--mint-ink); font:700 15px/1 var(--sans)}
.btn:hover{background:var(--paper); color:var(--ink-0)}
:focus-visible{outline:3px solid var(--mint); outline-offset:3px}
</style>
</head>
<body>
<main>
  <img class="seal" src="/assets/logo-seal.png" width="256" height="256"
       alt="Noble Father Creations seal: a gentleman in a top hat inside a wax seal ring.">
  <p class="mark"><span class="n">N</span>oble <span class="n">F</span>ather <span class="n">C</span>reations</p>
  <p class="tag">NFC Digital Experiences &middot; Dapper Dad</p>
  <h1>That tap went <span class="a">nowhere</span>.</h1>
  <p>This page doesn't exist &mdash; which, as it happens, is exactly what a dead link on a
     chip feels like. The guide itself is still right here.</p>
  <a class="btn" href="/">Back to the guide &rarr;</a>
</main>
</body>
</html>
