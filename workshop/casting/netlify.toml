#  Noble Father Creations — Netlify configuration
#
#  The site is plain static HTML/CSS/JS, exactly like The Portals. There is
#  no site build step: the gallery fetches data/statues.json in the browser
#  at runtime. Nothing to compile, nothing to break on deploy.
#
#  `sharp` is used by the INGEST script only. That runs on your machine,
#  not on Netlify — which is why the build command below is a no-op.
#
#  NOTHING HERE IS REQUIRED. This file only tunes caching and pretty URLs.
#  Delete it and the site still works, on Netlify or anywhere else — see
#  DEPLOYING.md. Image URLs are ordinary paths to real files, so the site
#  is not tied to this host.

[build]
  publish = "."
  command = "echo 'static site — no build step required'"

# ---------------------------------------------------------------------------
#  Pretty URLs — /statues instead of /statues/index.html
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/statues"
  to = "/statues/index.html"
  status = 200

# No redirect is needed for /statues/NFC-0001 — a real directory with its
# own index.html is generated for every piece, so those URLs resolve
# natively on any static host.

# ---------------------------------------------------------------------------
#  Caching
#  Data files must stay fresh so newly ingested pieces appear immediately.
#  Images are content-addressed by folder id and can cache hard.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/images/statues/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
