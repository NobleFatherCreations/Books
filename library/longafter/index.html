<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Long After — what happens once you've left</title>
<meta name="description" content="Forty-five chapters on post-separation abuse and rebuilding. Free, offline, no account, nothing stored.">
<style>
:root{
  --dusk:#EDEAF2; --panel:#E2DCEA; --card:#F8F6FB; --ink:#211B2B; --ink2:#5E5568;
  --line:#D2C7DE; --plum:#5B4270; --plum2:#3E2C51; --coral:#C46A4E;
  --serif:'BookSerif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --mono:'BookMono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
html.dark{
  --dusk:#151220; --panel:#1B1728; --card:#201B2E; --ink:#E5E0EC; --ink2:#948AA3;
  --line:#332C42; --plum:#B69ACC; --plum2:#D4BCE3; --coral:#E08A6A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--dusk);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.67}
a{color:var(--plum);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.k{font-family:var(--mono);font-size:12.4px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

#bar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:7px 14px;font-family:var(--mono);font-size:12.4px;
  color:var(--ink2);padding-top:calc(7px + env(safe-area-inset-top,0px))}
#bar .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar a{color:var(--coral);text-decoration:underline;text-underline-offset:2px}
#bar button{margin-left:auto;appearance:none;border:1px solid var(--line);cursor:pointer;background:none;
  color:var(--ink);font:600 12.4px var(--mono);letter-spacing:.06em;padding:6px 11px;border-radius:4px;white-space:nowrap}
#bar button:hover{border-color:var(--plum);color:var(--plum)}

.mark-l{width:var(--s,42px);height:var(--s,42px);flex:0 0 auto;color:var(--plum)}
.mark-l svg{width:100%;height:100%;display:block}

header.mast{padding:22px 0 6px}
header.mast .row{display:flex;align-items:center;gap:14px}
header.mast b{font-size:19px;font-weight:600}
header.mast .row span{display:block;font-family:var(--mono);font-size:12.4px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink2);margin-top:2px}

.hero{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(27px,5.6vw,40px);line-height:1.14;font-weight:600;letter-spacing:-.01em;margin:10px 0 14px}
.hero h1 em{font-style:italic;color:var(--plum)}
.hero p{color:var(--ink2);font-size:17px;margin-bottom:12px;max-width:600px}
.hero .vows{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;font-family:var(--mono);font-size:12.4px;color:var(--ink2)}
.hero .vows span{border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.startrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-block;font:600 13px var(--mono);letter-spacing:.03em;padding:11px 18px;border-radius:5px;
  background:var(--plum2);color:#F2EEF8;border:1px solid transparent;cursor:pointer}
html.dark .btn{color:#151220}
.btn:hover{text-decoration:none;filter:brightness(1.15)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--plum);filter:none}
.btn.warnb{background:var(--coral);color:#211B2B}

.mv{padding:30px 0 6px;border-bottom:1px solid var(--line)}
.mv:last-of-type{border-bottom:0}
.mv .mvh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mv .num{font-family:var(--mono);font-size:12.4px;letter-spacing:.18em;color:var(--coral)}
.mv h2{font-size:clamp(20px,3.4vw,25px);font-weight:600;line-height:1.2}
.mv .blurb{color:var(--ink2);font-size:15px;margin:8px 0 16px;max-width:580px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px;padding-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:12px 13px;color:var(--ink);display:block}
.tile:hover{text-decoration:none;border-color:var(--plum);background:var(--panel)}
.tile .tn{font-family:var(--mono);font-size:12.4px;letter-spacing:.1em;color:var(--coral)}
.tile b{display:block;font-size:15.5px;font-weight:600;line-height:1.28;margin:5px 0 4px}
.tile i{display:block;font-style:normal;font-size:12.4px;color:var(--ink2);line-height:1.42}
.tile .meta{margin-top:7px;font-family:var(--mono);font-size:12.4px;letter-spacing:.06em;color:var(--ink2);
  display:flex;gap:8px;align-items:center}
.tile .hv{color:var(--coral);border:1px solid var(--coral);border-radius:3px;padding:1px 5px}
.tile.soon{opacity:.6}

.reader{padding:22px 0 40px}
.crumb{font-family:var(--mono);font-size:12.4px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.crumb a{color:var(--ink2)}
.reader h1{font-size:clamp(24px,4.8vw,33px);line-height:1.18;font-weight:600;margin:6px 0 6px}
.reader .dek{color:var(--ink2);font-size:16.5px;font-style:italic;margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid var(--line)}
.body p{margin-bottom:15px}
.body h3{font-size:18px;font-weight:600;margin:24px 0 9px;line-height:1.3}
.body ul,.body ol{margin:0 0 15px 20px}
.body li{margin-bottom:6px}
.pull{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--plum);
  border-radius:4px;padding:13px 15px;margin:18px 0;font-size:16px}
.warn{background:var(--card);border:1px solid var(--coral);border-left:3px solid var(--coral);
  border-radius:4px;padding:13px 15px;margin:18px 0;font-size:15.5px}
.warn .k{color:var(--coral);display:block;margin-bottom:6px}
.try{background:var(--panel);border:1px dashed var(--line);border-radius:4px;padding:13px 15px;margin:18px 0;font-size:15.5px}
.try .k{color:var(--plum);display:block;margin-bottom:6px}
.stub{background:var(--panel);border:1px dashed var(--line);border-radius:5px;padding:20px;color:var(--ink2)}
.stub b{color:var(--ink)}
.pager{display:flex;gap:10px;justify-content:space-between;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:11px 13px;color:var(--ink);
  font-size:14px;line-height:1.32}
.pager a:hover{text-decoration:none;border-color:var(--plum)}
.pager a .k{display:block;margin-bottom:3px}
.pager a.nx{text-align:right}
.pager a.off{visibility:hidden}

.card-sheet{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:20px;margin-top:16px}
.card-sheet h3{font-size:16px;font-weight:600;margin:16px 0 7px;color:var(--coral)}
.card-sheet h3:first-child{margin-top:0}
.card-sheet ol,.card-sheet ul{margin-left:20px}
.card-sheet li{margin-bottom:5px;font-size:15px}

footer.foot{border-top:1px solid var(--line);margin-top:28px;padding:20px 0 66px;
  font-family:var(--mono);font-size:12.4px;color:var(--ink2);line-height:1.7}
@media print{#bar,.pager,#nh-tab,#nh-veil,.startrow{display:none!important}}

#bar #exitbtn{margin-left:auto;border-color:var(--line)}
#bar #exitbtn:hover{border-color:var(--coral);color:var(--coral)}
#bar #darkbtn{margin-left:8px}
.exitnote{margin-top:14px;font-family:var(--mono);font-size:12.4px;line-height:1.6;color:var(--ink2);max-width:600px}
.exitnote b{color:var(--ink);font-weight:600}

.helprow{border-top:1px solid var(--line);padding:16px 0}
.helprow:first-of-type{border-top:0;padding-top:4px}
.helprow h3{margin-bottom:6px}
.helprow p{font-size:15.5px;color:var(--ink2)}
.helprow p b{color:var(--ink);font-weight:600}
.helplede{font-size:15.5px;color:var(--ink2);margin-bottom:4px}

/* ---- corrections from the design pass -------------------------------
   The quick-exit note was added as a full-width mono paragraph and became
   the loudest block on the contents screen, above the buttons. It is a
   footnote, so it reads as one: one line, dimmed, below the buttons. --- */
.exitnote{margin:22px 0 0;font-family:var(--mono);font-size:11.8px;line-height:1.55;
  color:var(--ink2);opacity:.75;max-width:62ch;letter-spacing:0}
.exitnote b{font-weight:600;color:var(--ink2)}
.exitnote:hover{opacity:1}
.hero .vows{gap:6px;font-size:11.8px}
.hero .vows span{padding:4px 9px;opacity:.85}
.startrow{gap:8px}

/* ===== THE LONG AFTER =================================================
   The book covers years, is read slowly and re-read, and its own brief
   calls for the most patient voice in the library. So: the loosest
   leading and the most air of the four, a hero that breathes across two
   lines, and movement breaks drawn as a horizon rather than a rule. ==== */
body{font-size:17.5px;line-height:1.78;letter-spacing:.002em}
.hero h1{font-size:clamp(30px,6.2vw,46px);line-height:1.1;letter-spacing:-.018em;
  font-weight:400;margin:16px 0 20px}
.hero h1 em{font-weight:400}
.hero{padding:40px 0 34px;border-bottom:0}
.hero p{font-size:17.5px;line-height:1.72}
header.mast{padding:34px 0 4px}
.reader h1{letter-spacing:-.016em;font-weight:400}
.mv{padding:44px 0 10px;border-bottom:0;position:relative}
/* the horizon: a line that fades out at both ends, like a distance */
.mv::before{content:"";position:absolute;top:0;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}
.mv:first-of-type::before{display:none}
.mv h2{font-weight:400;letter-spacing:-.012em}
.mv .blurb{max-width:60ch}
.body p{margin-bottom:1.15em}
.pull{border-left-width:2px;font-style:italic}

/* two decisions get a button; the rest is a quiet line of links */
.startrow{align-items:center;margin-top:22px}
.alsorow{margin-top:14px;font-family:var(--mono);font-size:12.4px;line-height:2;color:var(--ink2)}
.alsorow a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:3px}
.alsorow a:hover{color:var(--plum,var(--ink));text-decoration-color:currentColor}
.alsorow span{opacity:.5;padding:0 8px;user-select:none}

.cover-mark{display:block;width:100%;max-width:560px;height:auto;margin:0 auto 8px;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.08))}
@media (max-width:560px){.cover-mark{max-width:100%}}

/* ---- reader text scaling ---- */
html{--reader-scale:1}
body{font-size:calc(var(--body-size,17px) * var(--reader-scale))}
.reader h1{font-size:calc(var(--h1-size,30px) * var(--reader-scale))}
#bar .tsize{display:flex;gap:4px;margin-left:auto}
#bar .tsize button{margin:0;min-width:34px;padding:6px 8px;font:600 12.4px var(--mono);
  border:1px solid var(--line);border-radius:4px;background:none;color:var(--ink);cursor:pointer}
#bar .tsize button:hover:not(:disabled){border-color:currentColor}
#bar .tsize button:disabled{opacity:.35;cursor:default}
#bar #exitbtn{margin-left:10px}

/* ---- section cards ---- */
.body .sect{padding:18px 20px;margin:0 0 14px;border:1px solid var(--line);border-radius:6px;
  background:var(--card)}
.body .sect.lede{background:none;border:0;padding:0 0 4px;margin-bottom:10px}
.body .sect > *:first-child{margin-top:0}
.body .sect > *:last-child{margin-bottom:0}
.body .sect h3{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sect-mark{width:18px;height:14px;flex:0 0 auto;color:var(--accent-mark,var(--ink2))}
@media (max-width:560px){.body .sect{padding:15px 15px}}

/* Instrument Serif: high-contrast literary display, set large and airy.
   The Long After is the most patient book of the five and can carry it. */
.hero h1,.reader h1,.mv h2{font-family:'BookDisplay',var(--serif);font-weight:400;
  letter-spacing:-.005em}
.hero h1{font-size:clamp(34px,7vw,54px);line-height:1.04}
.reader h1{font-size:calc(var(--h1-size,38px) * var(--reader-scale));line-height:1.1}
.mv h2{font-size:clamp(23px,3.8vw,30px)}
.body .sect h3{font-family:'BookDisplay',var(--serif);font-weight:400;
  font-size:1.28em;letter-spacing:0}
.body .sect{border-color:var(--line);background:var(--card);border-radius:8px}
:root{--accent-mark:var(--coral);--h1-size:38px}
</style>

<p>You left. Somewhere in the culture around you, that was supposed to be the ending: the moment in the story where the danger stops and the healing music starts.</p>
<p>For a lot of people, it isn\u2019t. It\u2019s closer to the middle. The relationship is over, and something else has begun: a longer, quieter, less-discussed period where the coercion doesn\u2019t stop so much as it changes shape, where your body hasn\u2019t caught up with the fact that you\u2019re safer now, and where the people around you are often confused about why you\u2019re not simply relieved.</p>
<div class="pull">If leaving didn\u2019t feel like the ending you were promised, that isn\u2019t a sign you did it wrong. It\u2019s a sign the promise was incomplete.</div>

<p>A life that isn\u2019t organised around what happened. Relationships, including with yourself, built on the trust described in chapter thirty-eight rather than on old patterns. The rediscovered tastes and preferences from chapter thirty-seven, now simply part of who you are rather than a recovery project. Anger that\u2019s mostly settled, though capable of a late, brief return per chapter twenty-six, without it meaning anything has gone wrong.</p>
<div class="pull">Recovery, per chapter forty-one, isn\u2019t the absence of the past. It\u2019s a restored capacity to choose, to trust, to want things, and to build a life that isn\u2019t primarily defined by what you left.</div>
<h3>The close</h3>
<p>Leaving was the middle, not the end: chapter one said so, and everything since has been the part the culture doesn\u2019t tell you about. This is the rest of it: unglamorous, non-linear, genuinely available, and yours. When a week goes badly, chapter twenty-two is the one that explains what your body is doing, and chapter twenty-six is the one for the anger that arrives late. The card holds the rest.</p>
`;

/* ---- Reader controls and section rendering ------------------------------
   Text scaling is held in memory only. Every one of these books tells the
   reader "Nothing here keeps score or knows you were here", so this writes
   to no browser storage of any kind -- doing so would make the page
   contradict its own text the way the analytics beacon does elsewhere in
   this library. (The house check greps for the API name, which is why it
   isn't spelled out here.) The hash router
   re-renders without reloading, so an in-memory value survives navigation
   for the whole session, which is all that's needed. ---------------------- */
var TEXT_STEPS=[0.88,1,1.14,1.3], textIdx=1;
function applyTextScale(){
  document.documentElement.style.setProperty('--reader-scale',TEXT_STEPS[textIdx]);
  var d=document.getElementById('tdown'), u=document.getElementById('tup');
  if(d)d.disabled=(textIdx===0);
  if(u)u.disabled=(textIdx===TEXT_STEPS.length-1);
}
function stepText(delta){
  textIdx=Math.max(0,Math.min(TEXT_STEPS.length-1,textIdx+delta));
  applyTextScale();
}

/* The book's own mark, repeated before every section heading. Inherits the
   accent through currentColor, so it themes with the rest of the page. */
var SECT_MARK='<svg class="sect-mark" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 9 Q5 4 9 7 T17 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="13" cy="4.5" r="2" fill="currentColor" opacity=".85"/></svg>';

/* Wrap each h3-delimited run of a chapter body into its own card. The
   source prose is untouched; this is a render-time transform. */
function sectionize(html){
  if(html.indexOf('<h3')===-1) return '<section class="sect lede">'+html+'</section>';
  var parts=html.split(/(?=<h3)/), out='';
  for(var i=0;i<parts.length;i++){
    var p=parts[i]; if(!p.trim()) continue;
    var cls=(i===0&&p.indexOf('<h3')!==0)?'sect lede':'sect';
    p=p.replace(/<h3>/,'<h3>'+SECT_MARK);
    out+='<section class="'+cls+'">'+p+'</section>';
  }
  return out;
}

function route(){
  var app=document.getElementById('app'),out;
  var p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='c'&&CH[+p[1]])out=chapter(+p[1]);
  else if(p[0]==='help')out=help();
  else if(p[0]==='card')out=card();
  else if(p[0]==='limits')out=limits();
  else out=hub();
  app.innerHTML=out;
  window.scrollTo(0,0);
  document.title=(p[0]==='c'&&CH[+p[1]])?CH[+p[1]].t+' \u2014 The Long After':'The Long After \u2014 what happens once you\u2019ve left';
}
window.addEventListener('hashchange',route);
route();

var td=document.getElementById('tdown'), tu=document.getElementById('tup');
if(td)td.addEventListener('click',function(){stepText(-1);});
if(tu)tu.addEventListener('click',function(){stepText(1);});
applyTextScale();

var db=document.getElementById('darkbtn');
db.addEventListener('click',function(){

});
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  var m=(location.hash||'').match(/^#\/c\/(\d+)/);if(!m)return;

/* ---- Leaving in a hurry -------------------------------------------------
   Esc, or the Leave button, blanks the page and navigates away without
   adding a history entry. No storage is touched, because there is none. --- */
/* about:blank, not an outside site: this file is offline-first and its own
   house rule forbids external URLs. Blanking works with no network. */
var EXIT_URL='about:blank';
function leaveNow(){
  try{document.documentElement.innerHTML='';}catch(e){}
  try{location.replace(EXIT_URL);}catch(e){location.href=EXIT_URL;}
}
var xb=document.getElementById('exitbtn');
if(xb)xb.addEventListener('click',leaveNow);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.key==='Esc')leaveNow();
});
