<!DOCTYPE html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Bricolage";src:url(../site/fractal/entertainment/f/bricolage.woff2) format("woff2");font-weight:400 800;font-display:swap}
@font-face{font-family:"Spectral";src:url(../site/fractal/entertainment/f/spectral-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Spectral";src:url(../site/fractal/entertainment/f/spectral-400i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Spectral";src:url(../site/fractal/entertainment/f/spectral-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Spectral";src:url(../site/fractal/entertainment/f/spectral-600i.woff2) format("woff2");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(../site/fractal/entertainment/f/plexmono-500.woff2) format("woff2");font-weight:500;font-display:swap}
/* Tokens are The Fractal's own (library/fractal/index.html): void/ink, eight stage colours, three altitude colours. */
:root{
  --void:#0A0B11;--void2:#0F1019;--ink:#141625;--ink2:#1B1E30;
  --line:rgba(150,160,200,.16);--line2:rgba(150,160,200,.10);
  --fg:#E7E5EE;--fg-dim:#A9AAC0;--fg-faint:#8A8CA6;
  --s1:#E5A93C;--s2:#DE7E5A;--s3:#CB5F7E;--s4:#9B5FB0;--s5:#7383D6;--s6:#2E9C8E;--s7:#8A9BAE;--s8:#B98A4A;
  --lv-ind:#E7B24A;--lv-inst:#6FA8DC;--lv-civ:#B58BE0;
  --accent:#E5A93C;--safe:#FF8A7A;
  --disp:"Bricolage",system-ui,sans-serif;--serif:"Spectral",Georgia,serif;--mono:"Plex Mono",ui-monospace,monospace;
  --measure:38rem;--ease:cubic-bezier(.2,.7,.2,1);
  /* names the shared House drawer reads */
  --bg:var(--void);--mut:var(--fg-dim);--sans:var(--disp);--accent-grad:#F2C46A;--accent-ink:#1A1206;
  --edge-hi:rgba(255,255,255,.08);--glow-1:rgba(229,169,60,.25);--va:var(--fg)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--void);color:var(--fg);font:400 1.125rem/1.7 var(--serif);
  font-variant-numeric:oldstyle-nums;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
a{color:var(--fg);text-decoration-color:rgba(229,169,60,.55);text-underline-offset:.18em;text-decoration-thickness:1px;
  transition:color .2s var(--ease),text-decoration-color .2s var(--ease)}
a:hover{color:var(--accent);text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0 0 1em}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#111;padding:8px 16px;z-index:999}
.skip:focus{left:16px}

/* chrome */
.progress{position:fixed;inset:0 0 auto;height:3px;z-index:60;pointer-events:none}
.progress span{display:block;height:100%;width:0;background:var(--accent);transform-origin:left}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 24px;background:rgba(10,11,17,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 1px 0 var(--line2)}
.mark{display:flex;flex-direction:column;text-decoration:none;line-height:1.15;min-height:44px;justify-content:center}
.mk-a{font:500 .75rem/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mk-b{font:700 1rem/1.25 var(--disp);color:var(--fg)}
.leave{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);
  border-radius:999px;background:var(--ink);color:var(--fg);font:600 .9375rem var(--disp);cursor:pointer;
  transition:background .2s var(--ease),border-color .2s var(--ease)}
.leave:hover{background:var(--ink2);border-color:var(--fg-dim)}
.crumbs{max-width:72rem;margin:0 auto;padding:16px 24px 0;font:500 .8125rem/1.6 var(--mono);color:var(--fg-faint);letter-spacing:.02em}
.crumbs a{color:var(--fg-dim);text-decoration:none}.crumbs a:hover{color:var(--accent)}
main{max-width:72rem;margin:0 auto;padding:0 24px}
.label,.kicker{font:500 .75rem/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--c,var(--accent)) 70%,#fff);margin:0 0 16px}
.kicker a{color:inherit;text-decoration:none}.kicker a:hover{text-decoration:underline}
.lede{font-size:1.25rem;line-height:1.55;color:var(--fg-dim);max-width:var(--measure);margin:24px 0 0}
.note{font-size:.9375rem;color:var(--fg-faint);max-width:var(--measure)}

/* home */
.cover{padding:96px 0 64px;max-width:56rem}
.cover h1{font-size:clamp(2.75rem,8vw,5.5rem);font-weight:800;letter-spacing:-.03em;line-height:.98}
.book{margin-top:24px;font:500 .8125rem var(--mono);color:var(--fg-faint);letter-spacing:.04em}
.book cite{font-style:normal;color:var(--fg-dim)}
.doors{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));margin:0 0 96px}
.door{display:block;padding:24px;background:var(--ink);border:1px solid var(--line2);border-radius:8px;text-decoration:none;
  transition:transform .25s var(--ease),border-color .25s var(--ease),background .25s var(--ease)}
.door:hover{transform:translateY(-2px);border-color:rgba(229,169,60,.5);background:var(--ink2);color:var(--fg)}
.dn{display:block;font:500 .75rem var(--mono);color:var(--accent);letter-spacing:.16em;margin-bottom:24px}
.door b{display:block;font:700 1.375rem/1.2 var(--disp);margin-bottom:8px}
.door small{display:block;font-size:1rem;line-height:1.5;color:var(--fg-dim)}
.band{padding:0 0 96px}
.band h2{font-size:clamp(1.75rem,4vw,2.5rem);margin-bottom:32px;max-width:40rem}
.band.small{max-width:var(--measure);color:var(--fg-dim)}
.top10{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:0;max-width:52rem}
.top10 li{display:grid;grid-template-columns:3.5rem 1fr;gap:16px;padding:24px 0;box-shadow:inset 0 -1px 0 var(--line2)}
.rk{font:800 2rem/1 var(--disp);color:var(--accent);opacity:.9}
.top10 h3{font-size:1.375rem;margin:0 0 8px}.top10 h3 a{text-decoration:none}.top10 h3 a:hover{text-decoration:underline}
.top10 p{margin:0;color:var(--fg-dim);font-size:1.0625rem;line-height:1.55}
.stages,.fams{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr))}
.stg,.fam{position:relative;display:flex;flex-direction:column;height:100%;padding:24px 24px 24px 28px;background:var(--ink);
  border-radius:8px;text-decoration:none;border:1px solid var(--line2);transition:transform .25s var(--ease),background .25s var(--ease)}
.stg::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.stg:hover,.fam:hover{transform:translateY(-2px);background:var(--ink2);color:var(--fg)}
.stg .n,.fam .n{font:500 .75rem var(--mono);letter-spacing:.16em;color:color-mix(in srgb,var(--c,var(--accent)) 62%,#fff);margin-bottom:16px}
.stg b,.fam b{font:700 1.25rem/1.2 var(--disp);margin-bottom:8px}
.stg small{font-size:.9375rem;line-height:1.5;color:var(--fg-dim);margin-bottom:16px}
.ct{margin-top:auto;font:500 .75rem var(--mono);color:var(--fg-faint);letter-spacing:.06em}

/* page heads */
.phead{padding:64px 0 48px;max-width:52rem}
.phead h1{font-size:clamp(2.25rem,6vw,4rem);font-weight:800;letter-spacing:-.025em}
.sub{font:italic 400 1.25rem var(--serif);color:var(--fg-dim);margin:8px 0 0}
.state{margin:32px 0 0;padding:16px 16px 16px 20px;max-width:var(--measure);background:var(--ink);border-radius:8px;
  font-size:.9375rem;line-height:1.55;color:var(--fg-dim);box-shadow:inset 3px 0 0 var(--fg-faint)}
.state span{display:block;font:500 .75rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);margin-bottom:4px}
.state-expert_reviewed,.state-sources_verified{box-shadow:inset 3px 0 0 var(--s6)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.chips a{font:500 .8125rem/1 var(--disp);padding:8px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg-dim);min-height:32px;display:inline-flex;align-items:center}
.chips a:hover{border-color:var(--c);color:var(--fg)}

/* prose */
.prose{max-width:var(--measure)}
.prose p,.prose li{hyphens:auto}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 1em}.prose li{margin:0 0 .5em}.prose li::marker{color:var(--fg-faint)}
.prose strong{font-weight:600;color:#F3F1F8}
p.first::first-letter{float:left;font:800 4.1em/.8 var(--disp);color:var(--accent);padding:.08em .1em 0 0}
.caution{margin:24px 0;padding:16px 20px;background:var(--ink);border-radius:8px;font-size:1rem;color:var(--fg-dim)}
.tg{display:inline-block;vertical-align:.12em;margin:0 2px;padding:1px 8px;border-radius:999px;font:500 .6875rem/1.6 var(--mono);
  letter-spacing:.04em;white-space:nowrap;color:var(--fg-dim);border:1px solid var(--line);cursor:help}
.tg-legal{color:#9CC4EA;border-color:rgba(111,168,220,.4)}
.tg-review,.tg-source{color:#F2C46A;border-color:rgba(229,169,60,.45)}
.tg-pattern,.tg-composite{color:var(--fg-dim)}
.slot{font-family:var(--mono);font-size:.875em;color:var(--accent);background:rgba(229,169,60,.1);padding:0 4px;border-radius:3px}
.held{color:var(--fg-faint)}

/* stage page */
.tacs{display:grid;gap:0;padding-bottom:48px}
.tac{padding:48px 0;box-shadow:inset 0 1px 0 var(--line2);scroll-margin-top:80px}
.tac:target h2 a{color:var(--c)}
.tno{font:500 .75rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 62%,#fff);margin:0 0 8px}
.tac h2{font-size:clamp(1.5rem,3.4vw,2rem);margin-bottom:16px}.tac h2 a{text-decoration:none}
.def{font-size:1.25rem;line-height:1.5}
.aka{font-size:.9375rem;color:var(--fg-faint);max-width:var(--measure)}
.levels{display:grid;gap:16px;margin:24px 0;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.lv{padding:16px 20px;background:var(--ink);border-radius:8px;box-shadow:inset 3px 0 0 var(--lc)}
.lv .prose p{font-size:1rem;line-height:1.6;margin:0}
.lvn{display:block;font:500 .6875rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--lc);margin:0 0 8px}
.lv-ind{--lc:var(--lv-ind)}.lv-inst{--lc:var(--lv-inst)}.lv-civ{--lc:var(--lv-civ)}
.levels.big{grid-template-columns:1fr;max-width:var(--measure)}
.levels.big .lv{padding:24px}.levels.big .lv .prose p{font-size:1.0625rem;margin:0 0 .8em}
.seen{font-size:1rem;color:var(--fg-dim);max-width:var(--measure);margin:16px 0 0}
.seen span{display:block;font:500 .6875rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:4px}
.seen a{margin-right:12px;white-space:nowrap}

/* combo page */
.combo-grid{display:grid;gap:48px;grid-template-columns:1fr}
.combo-body>section{padding:48px 0 0}
.combo-body h2{font-size:clamp(1.5rem,3vw,1.875rem);margin:0 0 24px;max-width:var(--measure)}
.toc{font:500 .875rem/1.5 var(--disp)}
.toc summary{font:500 .75rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border:1px solid var(--line);border-radius:8px;list-style:none}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"+";font:400 1.25rem var(--disp);color:var(--accent)}
.toc details[open] summary::after{content:"\2212"}
.toc details[open] ol{margin-top:12px}
.toc ol{list-style:none;margin:0;padding:0}.toc li a{display:block;padding:6px 0 6px 12px;color:var(--fg-dim);text-decoration:none;box-shadow:inset 1px 0 0 var(--line)}
.toc li a:hover,.toc li a.on{color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.safety{max-width:var(--measure);margin:0 0 16px;padding:24px;border-radius:8px;background:rgba(255,138,122,.08);
  box-shadow:inset 0 0 0 1px rgba(255,138,122,.45)}
.safety-h{display:flex;align-items:center;gap:8px;font:600 .875rem var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--safe);margin:0 0 12px}
.safety .prose p{font-size:1.0625rem;margin:0;hyphens:manual}
.lede,.state,.def{hyphens:manual}
.scene p{font-size:1.1875rem;line-height:1.75}
.name-line{max-width:var(--measure);margin:48px 0 0;padding:32px 0;font:800 clamp(1.75rem,4vw,2.5rem)/1.15 var(--disp);
  letter-spacing:-.02em;box-shadow:inset 0 1px 0 var(--line),inset 0 -1px 0 var(--line)}
.name-line strong{color:var(--accent);font-weight:800}
.cues{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.cue{padding:24px;background:var(--ink);border-radius:8px;border:1px solid var(--line2)}
.cue h3{font:700 1.0625rem/1.3 var(--disp);margin:0 0 12px;color:var(--accent)}
.cue .prose p{font-size:1rem;line-height:1.55;margin:0 0 8px}
.escs{display:grid;gap:12px;max-width:var(--measure)}
.esc{padding:16px 20px;border-radius:8px;background:var(--ink);box-shadow:inset 3px 0 0 var(--fg-faint)}
.esc p{margin:0;font-size:1.0625rem}
.esc-h{font:600 .8125rem var(--mono)!important;letter-spacing:.08em;margin-bottom:8px!important;color:var(--fg)}
.esc-high{box-shadow:inset 3px 0 0 var(--s2)}.esc-urgent{box-shadow:inset 3px 0 0 var(--safe);background:rgba(255,138,122,.06)}
.esc-moderate{box-shadow:inset 3px 0 0 var(--s1)}
.reflect{max-width:var(--measure);margin:64px 0 0;padding:0;font:italic 400 clamp(1.375rem,3vw,1.75rem)/1.4 var(--serif);color:var(--fg)}
.reflect::before{content:"";display:block;width:48px;height:2px;background:var(--accent);margin-bottom:24px}
.aside-sec{max-width:var(--measure)}
.aside-sec h2{font-size:1.25rem!important}
.plain{padding-left:1.25em;margin:0}.plain li{margin:0 0 8px}
.legend p{font-size:.9375rem;line-height:2;color:var(--fg-dim)}

/* family + lists */
.intro{margin-bottom:48px}
.cards{list-style:none;margin:0 0 48px;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr))}
.card{display:flex;flex-direction:column;height:100%;padding:24px;background:var(--ink);border:1px solid var(--line2);border-radius:8px;
  text-decoration:none;transition:transform .25s var(--ease),border-color .25s var(--ease)}
.card:hover{transform:translateY(-2px);border-color:rgba(229,169,60,.5);color:var(--fg)}
.card b{font:700 1.25rem/1.2 var(--disp);margin-bottom:8px}.card small{font-size:1rem;line-height:1.5;color:var(--fg-dim);margin-bottom:16px}
.meta{margin-top:auto;font:500 .75rem var(--mono);color:var(--fg-faint);letter-spacing:.06em}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:48px 0 96px}
.pn a{display:block;padding:16px 20px;background:var(--ink);border-radius:8px;text-decoration:none;min-height:44px}
.pn small{display:block;font:500 .6875rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}
.pn b{font:700 1.0625rem var(--disp)}.pn .nx{text-align:right}
.std section{padding:0 0 48px}.std h2{font-size:1.5rem;margin-bottom:16px}
.filter{display:flex;flex-direction:column;gap:8px;margin-top:32px;max-width:28rem}
.filter span{font:500 .75rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}
.filter input{font:400 1.125rem var(--disp);padding:12px 16px;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:8px;min-height:48px}
.filter input:focus{border-color:var(--accent);outline:none}
.az{list-style:none;margin:0 0 96px;padding:0;columns:2 22rem;column-gap:48px}
.az li{break-inside:avoid;padding:8px 0;box-shadow:inset 0 -1px 0 var(--line2)}
.az a{font:600 1rem/1.35 var(--disp);text-decoration:none}.az span{display:block;font:500 .6875rem var(--mono);color:var(--fg-faint);letter-spacing:.06em}

.foot{max-width:72rem;margin:96px auto 0;padding:48px 24px 120px;box-shadow:inset 0 1px 0 var(--line2);color:var(--fg-faint);font-size:.9375rem}
.foot nav{display:flex;flex-wrap:wrap;gap:0 24px;margin-bottom:16px}
.foot nav a{min-height:44px;display:inline-flex;align-items:center;font:600 .9375rem var(--disp);color:var(--fg-dim);text-decoration:none}
.foot p{max-width:var(--measure)}.fine{font:500 .75rem var(--mono);letter-spacing:.04em}

/* social cards (og.mjs) */
.ogb{margin:0;width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;padding:80px;display:flex;flex-direction:column;justify-content:center;
  background:radial-gradient(900px 500px at 85% 20%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%),var(--void)}
.og h1{font-size:96px;font-weight:800;letter-spacing:-.03em;line-height:.98;max-width:1000px}
.og .kicker{font-size:22px}.ogs{font:400 30px var(--serif);color:var(--fg-dim);margin:24px 0 0}
.ogf{position:absolute;left:80px;bottom:56px;font:500 20px var(--mono);color:var(--fg-faint);letter-spacing:.06em}

@media (max-width:63.99rem){.combo-grid{gap:24px}}
@media (min-width:64rem){
  .combo-grid{grid-template-columns:13rem minmax(0,1fr)}
  .toc summary{border:0;padding:0;justify-content:flex-start}.toc summary::after{display:none}
  .toc details{position:sticky;top:96px}
  .toc details:not([open]) summary{pointer-events:none}
}
@media (max-width:40rem){
  body{font-size:1.0625rem}
  .top{padding:8px 16px}.crumbs,main{padding-left:16px;padding-right:16px}
  .cover{padding:56px 0 48px}.phead{padding:40px 0 32px}
  .leave span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .leave{padding:0 12px}
  .pn{grid-template-columns:1fr}.pn .nx{text-align:left}
  .top10 li{grid-template-columns:2.5rem 1fr}.rk{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.top,.progress,.toc,.foot nav,#nf-chrome,.leave{display:none}body{background:#fff;color:#000}}
</style></head><body class="ogb"><div class="og" style="--c:var(--s7)"><p class="kicker">Stage 7 of 8</p><h1>Discard</h1><p class="ogs">Entertainment &amp; Music Industry</p><p class="ogf">noblefathercreations.com/fractal</p></div></body></html>
