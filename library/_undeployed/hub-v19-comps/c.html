<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comp C</title><link rel="stylesheet" href="/_undeployed/hub-v19-comps/common.css">
<style>
/* C: four doors. The first screen is four big picture tiles, one per world, under the name and the line. */
.words{position:absolute;left:16px;right:16px;top:84px}
.words h1{font-size:34px}
.words .eyebrow{margin-bottom:8px}
.grid{position:absolute;left:16px;right:16px;top:200px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
.t{position:relative;border-radius:12px;overflow:hidden;background:var(--ink-2);border:1px solid var(--line)}
.t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t b{position:absolute;left:12px;bottom:10px;right:12px;font:400 22px/1.05 Gloock,Georgia,serif;text-shadow:0 2px 12px #000}
.t::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000c)}
.t b{z-index:1}
.lib{display:flex;align-items:center;justify-content:center;gap:0}
.lib img{position:absolute;width:52%;height:auto;inset:auto;top:12%;border-radius:3px;box-shadow:8px 12px 20px #000a}
.lib img:nth-child(1){left:6%;transform:rotate(-8deg)}.lib img:nth-child(2){left:24%;z-index:1}.lib img:nth-child(3){left:42%;transform:rotate(8deg)}
.port{background:var(--night)}
.mus{background:radial-gradient(circle at 50% 42%,#2a1f15,#120d09)}
.mus .wave{position:absolute;left:12%;right:12%;top:30%;height:34%;display:flex;align-items:center;gap:4px}
.mus .wave i{flex:1;background:var(--brass);border-radius:2px;opacity:.85}
.nfc{background:var(--night)}
</style></head><body>
<header class="top"><span class="brand">Noble Father</span><span class="acts"><span class="ic">II</span><span class="ic">≡</span><span class="leave">Leave now</span></span></header>
<div class="words"><p class="eyebrow">Noble Father Creations</p><h1>Worn in the light. <span class="glowtxt">Alive in the dark.</span></h1></div>
<div class="grid">
<div class="t lib"><img src="/media/v18/silence-480.webp" alt=""><img src="/media/v18/longafter-480.webp" alt=""><img src="/media/v18/atwill-480.webp" alt=""><b>The Library</b></div>
<div class="t port"><img src="/media/v18/portal-1-night-720.webp" alt=""><b>The Portals</b></div>
<div class="t mus"><div class="wave"><i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:60%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:50%"></i><i style="height:25%"></i><i style="height:65%"></i></div><b>The Listening Room</b></div>
<div class="t nfc"><img src="/media/v18/nfc-guide-640.webp" alt="" style="object-position:50% 20%"><b>NFC guide</b></div>
</div>
<span class="label">C · Four doors</span>
</body></html>
