<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seal storyboard</title><link rel="stylesheet" href="/_undeployed/hub-v19-comps/common.css">
<style>
/* Storyboard for the opening: ?f=0 sealed, ?f=1 the seal cracks and the letter opens, ?f=2 the four doors. Static frames, not the build. */
body{background:var(--ink)}
.words{position:absolute;left:16px;right:16px;top:92px;text-align:center;z-index:4}
.words .eyebrow{margin-bottom:10px}
.words h1{font-size:38px}
.letter{position:absolute;left:8%;right:8%;top:300px;aspect-ratio:1.38;background:linear-gradient(160deg,#efe4cc,#d8c9a8);border-radius:6px;box-shadow:0 30px 60px #000a;overflow:visible}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(#e6d8ba,#d3c29f);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;filter:drop-shadow(0 4px 6px #0004);z-index:2}
.fold{position:absolute;inset:0;background:linear-gradient(32deg,transparent 49.6%,#0000001a 50%,transparent 50.4%),linear-gradient(-32deg,transparent 49.6%,#0000001a 50%,transparent 50.4%)}
.seal{position:absolute;left:50%;top:60%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:3}
.seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px #0007)}
.half{position:absolute;inset:0;transition:none}
.half.l{clip-path:polygon(0 0,52% 0,46% 40%,54% 62%,48% 100%,0 100%)}
.half.r{clip-path:polygon(52% 0,100% 0,100% 100%,48% 100%,54% 62%,46% 40%)}
.light{position:absolute;left:50%;top:40%;width:70%;height:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,#f3dca0,#86ecd244 60%,transparent);opacity:0;z-index:1}
.cue{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);color:var(--muted);font-size:26px}
.grid{position:absolute;left:16px;right:16px;top:248px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;opacity:0}
.t{position:relative;border-radius:12px;overflow:hidden;background:var(--ink-2);border:1px solid var(--line)}
.t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000d)}
.t b{position:absolute;left:12px;bottom:10px;right:12px;z-index:1;font:400 22px/1.05 Gloock,Georgia,serif}
.lib img{width:52%;height:auto;inset:auto;top:12%;border-radius:3px;box-shadow:8px 12px 20px #000a}
.lib img:nth-child(1){left:6%;transform:rotate(-8deg)}.lib img:nth-child(2){left:24%;z-index:1}.lib img:nth-child(3){left:42%;transform:rotate(8deg)}
.mus{background:radial-gradient(circle at 50% 42%,#2a1f15,#120d09)}
.mus .wave{position:absolute;left:12%;right:12%;top:30%;height:34%;display:flex;align-items:center;gap:4px}.mus .wave i{flex:1;background:var(--brass);border-radius:2px}
.nfc img{object-position:50% 12%}
.nfc .tap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:70px}
/* frames */
.f1 .flap{transform:rotateX(150deg)}
.f1 .half.l{transform:translate(-18px,8px) rotate(-14deg)}.f1 .half.r{transform:translate(18px,10px) rotate(12deg)}
.f1 .light{opacity:1}
.f1 .words{opacity:.5}
.f2 .letter,.f2 .cue{display:none}
.f2 .grid{opacity:1}
.f2 .words{top:84px;text-align:left}.f2 .words h1{font-size:30px}
</style></head><body>
<header class="top"><span class="brand">Noble Father</span><span class="acts"><span class="ic">II</span><span class="ic">≡</span><span class="leave">Leave now</span></span></header>
<div class="words"><p class="eyebrow">Noble Father Creations</p><h1>Worn in the light.<br><span class="glowtxt">Alive in the dark.</span></h1></div>
<div class="letter"><div class="fold"></div><div class="light"></div><div class="flap"></div>
<div class="seal">
<div class="half l"><svg viewBox="0 0 64 64"><path fill="#9a3a2c" d="M32 4l4.6 3.4 5.6-.9 2.6 5 5.3 2-.3 5.7 3.9 4.1-2.4 5.2 2.4 5.2-3.9 4.1.3 5.7-5.3 2-2.6 5-5.6-.9L32 60l-4.6-3.4-5.6.9-2.6-5-5.3-2 .3-5.7-3.9-4.1 2.4-5.2-2.4-5.2 3.9-4.1-.3-5.7 5.3-2 2.6-5 5.6.9z"/><circle cx="32" cy="32" r="16" fill="none" stroke="#5e1f16" stroke-width="2"/><path d="M25 40V24l14 16V24" fill="none" stroke="#e7c77d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="half r"><svg viewBox="0 0 64 64"><path fill="#9a3a2c" d="M32 4l4.6 3.4 5.6-.9 2.6 5 5.3 2-.3 5.7 3.9 4.1-2.4 5.2 2.4 5.2-3.9 4.1.3 5.7-5.3 2-2.6 5-5.6-.9L32 60l-4.6-3.4-5.6.9-2.6-5-5.3-2 .3-5.7-3.9-4.1 2.4-5.2-2.4-5.2 3.9-4.1-.3-5.7 5.3-2 2.6-5 5.6.9z"/><circle cx="32" cy="32" r="16" fill="none" stroke="#5e1f16" stroke-width="2"/><path d="M25 40V24l14 16V24" fill="none" stroke="#e7c77d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div></div>
<span class="cue" aria-hidden="true">⌄</span>
<div class="grid">
<div class="t lib"><img src="/media/v18/silence-480.webp" alt=""><img src="/media/v18/longafter-480.webp" alt=""><img src="/media/v18/atwill-480.webp" alt=""><b>The Library</b></div>
<div class="t"><img src="/media/v18/portal-1-night-720.webp" alt=""><b>The Portals</b></div>
<div class="t mus"><div class="wave"><i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:60%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:50%"></i><i style="height:25%"></i><i style="height:65%"></i></div><b>The Listening Room</b></div>
<div class="t nfc"><img src="/media/v18/nfc-guide-640.webp" alt=""><b>NFC guide</b></div>
</div>

</body></html>
