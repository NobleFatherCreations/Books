BODIES[1]=`
<p>Most adults spend more of their waking hours at work than anywhere else: more than with a partner, more than with children, more than asleep on a good week.</p>
<p>That fact alone should make the workplace one of the most closely examined rooms in any account of coercion and control. It largely isn\u2019t. There\u2019s a chapter about it in one book in this library and a single sector in the architecture that maps twenty-nine others. That\u2019s not proportionate to the hours, and this book is the correction.</p>
<h3>What this book adds</h3>
<p>Not a new theory. The same architecture this library uses everywhere \u2014 the eight stages that show up in a marriage, a church, a feed \u2014 applied explicitly and in detail to a job. What a moving target looks like on a payslip. What isolation looks like in a reorg. What extraction looks like in unpaid overtime.</p>
<div class="pull">If you\u2019ve felt something was wrong at work and couldn\u2019t name it, that\u2019s not a gap in you. It\u2019s a gap in what\u2019s been written down, and this book exists to close it.</div>
<h3>What it isn\u2019t</h3>
<p>It isn\u2019t a labour-law textbook, and it can\u2019t be: the specific rules differ by country, by state, sometimes by city. Where this book talks about what you\u2019re legally owed, it teaches you the category and points you to checking the specifics where you are, the same way the rest of this library routes readers to the right regulator in their own country rather than pretending one country\u2019s rules are universal.</p>
<p>What it can promise: by the end, you\u2019ll have the vocabulary to name what\u2019s happening, the checklist to know what you\u2019re actually owed, and the sequence of moves, not just one move, available to you.</p>
`;

BODIES[2]=`
<p>Somebody says it in the first week, usually with real warmth. <em>We\u2019re a family here.</em></p>
<p>It\u2019s worth pausing on, because it should worry you slightly, and the reason is structural rather than cynical.</p>
<h3>What families don\u2019t do</h3>
<p>Families don\u2019t fire each other. They don\u2019t restructure a sibling out of the household because the quarter was soft. They don\u2019t require ninety days\u2019 notice and a reference check before they\u2019ll let a member back in.</p>
<p>An employer retains every one of the powers that make employment different from family \u2014 the power to end it, the power to set the terms, the power to require things in exchange for continued inclusion \u2014 while asking, through the family language, for the loyalty, flexibility, and personal investment that family membership is supposed to earn.</p>
<div class="pull">You\u2019re being asked to accept the obligations of family without its protections. That\u2019s not a fair trade, however warmly it\u2019s offered.</div>
<h3>The test</h3>
<p>Does the family language survive a bad quarter?</p>
<p>A real family doesn\u2019t evict a struggling member. A \\u201cwork family\\u201d that quietly lays off ten percent while continuing to use the language in every all-hands meeting has told you what the language was actually for: retention, at a discount, dressed as belonging.</p>
<h3>What this isn\u2019t</h3>
<p>Not every warm workplace is manipulative, and real camaraderie among coworkers is a genuine good worth having. The distinction is whether the warmth is being used <em>instead of</em> fair terms \u2014 pay, security, honest process \u2014 or alongside them. Chapter four goes deeper into the specific substitution this often enables.</p>
`;

BODIES[3]=`
<p>Before assessing anything anyone said to you at work, map who actually holds what.</p>
<h3>The exercise</h3>
<div class="try"><span class="k">Fifteen seconds each</span>
<ul style="margin:0 0 0 18px">
<li>Who can end this relationship, and how easily?</li>
<li>Who needs the income more, right now, this month?</li>
<li>Who has savings, another offer, or a partner\u2019s income to fall back on?</li>
<li>Whose account of a disagreement would a third party believe by default?</li>
<li>Who set the review schedule, the pay bands, the definition of \\u201cgood performance\\u201d?</li>
</ul></div>
<p>Almost always, the employer holds more of these than the individual worker does. That asymmetry doesn\u2019t make every manager abusive. It changes what identical words actually mean.</p>
<div class="pull">\\u201cNo pressure, just a thought\\u201d from a peer is a thought. From someone who can end your employment, it\u2019s an instruction with plausible deniability built in.</div>
<h3>Why this matters before anything else</h3>
<p><em>The Weighing</em>, elsewhere in this library, makes the point that power amplifies whatever behaviour is already happening. A mediocre manager with real power over your income does more damage with the same words than an equally mediocre peer ever could. Map the power first. It\u2019s the lens the rest of this book gets read through.</p>
`;

BODIES[4]=`
<p>\\u201cDo what you love and you\u2019ll never work a day in your life.\\u201d It\u2019s a nice sentence, and it does specific, measurable work in a lot of industries: it gets people to accept less money for the same labour, because the meaning is supposed to make up the difference.</p>
<h3>Where this runs hardest</h3>
<p>Nonprofits, media, the arts, care work, education, early-stage startups: anywhere the work is genuinely meaningful, and genuinely draws people who would do some version of it even if it paid less. That\u2019s precisely what makes the discount available: the employer doesn\u2019t have to compete as hard on wage, because the mission is doing some of the recruiting.</p>
<div class="pull">Loving the work and being underpaid for it are not contradictory facts. Both can be true, and naming the second doesn\u2019t require giving up the first.</div>
<h3>The tell</h3>
<p>Ask what happens to the meaning when the pay conversation comes up. If \\u201cthink about the impact you\u2019re having\\u201d arrives specifically and reliably at salary review time, that\u2019s the discount being invoked on schedule, not a coincidence.</p>
<h3>What this isn\u2019t</h3>
<p>Not an argument that you should quit a job you love, or that meaningful work is a trap. It\u2019s permission to hold both things at once: this work matters to me, and I am allowed to also be paid fairly for it. Those aren\u2019t in tension, whatever the framing at review time implies.</p>
`;

BODIES[5]=`
<p>Before the rest of this book, one distinction that has to hold throughout it: a bad job is not automatically a coercive one, and collapsing that difference does a disservice to both.</p>
<h3>The gradient</h3>
<div class="grad"><span>disorganised</span><span>demanding</span><span>unfair</span><span>exploitative</span><span>coercive</span></div>
<p>A disorganised workplace has unclear processes and a manager who forgets things. A demanding one asks a lot and delivers on its side of the bargain. An unfair one plays favourites. An exploitative one takes more than it gives, consistently, and knows it. A coercive one does all of that while also controlling what you can say, who you can talk to, and what happens if you try to leave or complain.</p>
<div class="pull">The same test as everywhere else in this library: does it reduce the moves actually available to you? A demanding job asks more of your time. A coercive one shrinks your options.</div>
<h3>Why the distinction matters here specifically</h3>
<p>Every chapter after this one describes patterns that exist on a spectrum. Manufactured urgency exists in genuinely urgent industries and also as a permanent control mechanism. A tough performance review exists honestly and also as a manufactured record. This book is written for the coercive end of each spectrum, not as a diagnostic for every hard day at an ordinary job.</p>
<p>Run the four dimensions from <em>The Weighing</em> \u2014 frequency, duration, escalation, response when named \u2014 on your own situation before deciding which end of the gradient you\u2019re actually on.</p>
`;

function chapter(n){
  var c=CH[n];if(!c)return hub();
  var m=mvOf(n),body=BODIES[n],prev=CH[n-1]?n-1:0,next=CH[n+1]?n+1:0;
  var h='<div class="wrap"><section class="reader">'+
    '<div class="crumb"><a href="#/">At Will</a> &middot; <span>Movement '+(m?m.r:'')+' &mdash; '+esc(m?m.t:'')+'</span> &middot; <span>'+(n<10?'0'+n:n)+' of 47</span></div>'+
    '<h1>'+esc(c.t)+'</h1><p class="dek">'+esc(c.d)+'</p>';
  h+= body ? '<div class="body">'+body+'</div>'
           : '<div class="stub"><b>This chapter is being written.</b><p style="margin-top:10px">'+esc(c.d)+
             '</p><p style="margin-top:10px">The book goes up movement by movement rather than waiting until all forty-seven are done, '+
             'so what is here is finished rather than drafted.</p></div>';
  h+='<div class="pager">'+
     (prev?'<a href="#/c/'+prev+'"><span class="k">&larr; Previous</span>'+esc(CH[prev].t)+'</a>':'<a class="off">&nbsp;</a>')+
     (next?'<a class="nx" href="#/c/'+next+'"><span class="k">Next &rarr;</span>'+esc(CH[next].t)+'</a>':'<a class="off nx">&nbsp;</a>')+
     '</div></section></div>';
  return h;
}

function card(){
  return '<div class="wrap"><section class="reader">'+
  '<div class="crumb"><a href="#/">At Will</a> &middot; <span>Appendix A</span></div>'+
  '<h1>The card</h1><p class="dek">The parts you will actually use.</p>'+
  '<div class="card-sheet">'+
  '<h3>The gradient</h3>'+
  '<div class="grad"><span>disorganised</span><span>demanding</span><span>unfair</span><span>exploitative</span><span>coercive</span></div>'+
  '<p style="font-size:15px;color:var(--ink2)">Does it reduce the moves actually available to you? That\u2019s the hinge.</p>'+
  '<h3>Document, starting today</h3><ul>'+
  '<li>Dates, specific words, who was present.</li>'+
  '<li>Anything in writing \u2014 forwarded to a personal account, not stored on employer systems.</li>'+
  '<li>Keep it even if you never use it.</li></ul>'+
  '<h3>The naming test, at work</h3>'+
  '<p style="font-size:15.5px">Describe the specific behaviour plainly, in writing if possible. Watch whether the response engages '+
  'the content or attacks the fact that you raised it. Know your rights and have documentation <em>before</em> you do this.</p>'+
  '<h3>Where to check</h3>'+
  '<p style="font-size:15.5px">Every legal claim in this book varies by country. Search your labour ministry or department of labour, '+
  'plus the word "employee rights," for where you actually are. <a href="#/c/35">Chapter 35 \u2192</a></p>'+
  '<h3>The full sequence, in order</h3>'+
  '<p style="font-size:15.5px">Document (36) \u2192 raise it internally with the naming test (37) \u2192 formal grievance if one exists (38) \u2192 '+
  'talk to a coworker, this is already collective action (39) \u2192 the regulator, not a last resort (40) \u2192 free legal advice (41).</p>'+
  '<h3>Whistleblowing, honestly</h3>'+
  '<p style="font-size:15.5px">Real protection exists. Real retaliation still happens despite it. Document first, get advice first, '+
  'understand the correct channel before reporting. <a href="#/c/43">Chapter 43 \u2192</a></p>'+
  '</div><div class="pager"><a href="#/"><span class="k">&larr; Back</span>All forty-seven chapters</a>'+
  '<a class="nx" href="#/limits"><span class="k">Next &rarr;</span>What this book might have wrong</a></div>'+
  '</section></div>';
}

function limits(){
  return '<div class="wrap"><section class="reader">'+
  '<div class="crumb"><a href="#/">At Will</a> &middot; <span>Appendix B</span></div>'+
  '<h1>What this book might have wrong</h1>'+
  '<p class="dek">Published rather than buried.</p>'+
  '<div class="body">'+
  '<h3>What is well evidenced</h3>'+
  '<p>Wage theft through unpaid overtime and unfavourable time-rounding, extensively documented across countries and industries. '+
  'The mechanics of algorithmic management, documented in detail in <em>The Loop</em> and transferring here without modification. '+
  'The goalpost-moving and PIP-as-pretext patterns, widely reported by employment specialists across many industries.</p>'+
  '<h3>What is contested</h3>'+
  '<p>Non-compete enforceability, which varies so dramatically by jurisdiction that any general claim risks being wrong somewhere. '+
  'Arbitration outcome statistics \u2014 aggregate patterns suggest one direction, individual outcomes vary enormously. '+
  'Whether whistleblower protection is adequate in practice or only on paper \u2014 a live, unresolved debate among specialists.</p>'+
  '<h3>What is this book\u2019s inference</h3>'+
  '<p>The &ldquo;we\u2019re a family&rdquo; framing as a specific, named substitution mechanism. The loyalty-debt mechanism, similarly. '+
  'The chapter ordering in movement six \u2014 documentation, then internal, then collective, then external \u2014 reflects this book\u2019s judgment '+
  'about what generally works best, not a universally validated sequence.</p>'+
  '<h3>The biggest risk this book carries</h3>'+
  '<p>Jurisdiction variance. Despite constant flagging throughout, a reader could still apply a general principle to their specific '+
  'situation incorrectly, because the variance between places is larger than any single book can fully convey. Chapter thirty-five\u2019s '+
  'instruction to check locally is not a formality \u2014 it is the single most important instruction here for anyone about to act on '+
  'anything legal.</p>'+
  '<h3>What would change its mind</h3><ul>'+
  '<li>If documented cases showed the goalpost/PIP-as-pretext pattern was rare rather than common, movement two would be overstating '+
  'a marginal phenomenon.</li>'+
  '<li>If collective action were shown to underperform individual complaint in current conditions, chapter thirty-nine\u2019s central claim '+
  'would need revising.</li>'+
  '<li>If whistleblower protections were shown to reliably prevent retaliation in practice, chapter forty-three\u2019s &ldquo;honest gap&rdquo; '+
  'framing would be overly pessimistic.</li></ul>'+
  '</div>'+
  '<div class="pager"><a href="#/card"><span class="k">&larr; Previous</span>Appendix A &mdash; the card</a>'+
  '<a class="nx" href="#/"><span class="k">Back &rarr;</span>All forty-seven chapters</a></div>'+
  '</section></div>';
}

function help(){
  return '<div class="wrap"><section class="reader">'+
  '<div class="crumb"><a href="#/">At Will</a> &middot; <span>Help</span></div>'+
  '<h1>Where to actually go</h1>'+
  '<p class="dek">Routes out of this book, not further into it.</p>'+
  '<p class="helplede">This book has no way of knowing which country you are in, so it does not pretend to. Each row below is the category of thing that exists nearly everywhere and the search that finds the real one where you are. Government and established-charity sites, not aggregators.</p>'+
  '<div class="card-sheet">'+
  '<div class="helprow"><h3>If you are in danger, or in crisis, right now</h3><p>Call your country&rsquo;s emergency number. A workplace is not a lesser cause of a crisis than anything else, and this book has no chapter that is more use to you than that call.</p></div>'+
  '<div class="helprow"><h3>If this has become thoughts of ending your life</h3><p>Search <b>&ldquo;[your country] suicide prevention helpline&rdquo;</b>, or go to an emergency department. Sustained workplace bullying and humiliation are a documented route to exactly this, and it is the most predictable serious harm the subject of this book causes.</p></div>'+
  '<div class="helprow"><h3>A doctor</h3><p>A GP or family doctor is the right route for what movement four does to sleep, appetite and concentration. It also produces a dated medical record, which is independently useful later if a grievance or a claim follows &mdash; but that is a side effect, not the reason to go.</p></div>'+
  '<div class="helprow"><h3>Your rights, where you actually are</h3><p>Search <b>&ldquo;[your country] department of labour&rdquo;</b> or <b>&ldquo;[your country] employment rights&rdquo;</b>. Government sites, not aggregators. <a href="#/c/35">Chapter 35 &rarr;</a></p></div>'+
  '<div class="helprow"><h3>A union</h3><p>Whether or not you are a member, and whether or not one is recognised where you work. Many will give information to a non-member. Talking to one coworker is already the smallest version of this. <a href="#/c/39">Chapter 39 &rarr;</a></p></div>'+
  '</div>'+
  '<div class="pager"><a href="#/"><span class="k">&larr; Back</span>All forty-seven chapters</a>'+
  '<a class="nx" href="#/card"><span class="k">Next &rarr;</span>Appendix A &mdash; the card</a></div>'+
  '</section></div>';
}

function route(){
  var app=document.getElementById('app'),out;
  var p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='c'&&CH[+p[1]])out=chapter(+p[1]);
  else if(p[0]==='help')out=help();
  else if(p[0]==='card')out=card();
  else if(p[0]==='limits')out=limits();
  else out=hub();
  app.innerHTML=out;
  window.scrollTo(0,0);
  document.title=(p[0]==='c'&&CH[+p[1]])?CH[+p[1]].t+' \u2014 At Will':'At Will \u2014 the coercive workplace';
}
window.addEventListener('hashchange',route);
route();

var db=document.getElementById('darkbtn');
db.addEventListener('click',function(){
  var on=document.documentElement.classList.toggle('dark');
  db.setAttribute('aria-pressed',String(on));
  db.textContent=on?'Light':'Dark';
});
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  var m=(location.hash||'').match(/^#\/c\/(\d+)/);if(!m)return;
  var n=+m[1];
  if(e.key==='ArrowRight'&&CH[n+1])location.hash='#/c/'+(n+1);
  if(e.key==='ArrowLeft'&&CH[n-1])location.hash='#/c/'+(n-1);
});

/* ---- Leaving in a hurry -------------------------------------------------
   Esc, or the Leave button, blanks the page and navigates away without
   adding a history entry. No storage is touched, because there is none. --- */
/* about:blank, not an outside site: this file is offline-first and its own
   house rule forbids external URLs. Blanking works with no network. */
var EXIT_URL='about:blank';
function leaveNow(){
  try{document.documentElement.innerHTML='';}catch(e){}
  try{location.replace(EXIT_URL);}catch(e){location.href=EXIT_URL;}
}
var xb=document.getElementById('exitbtn');
if(xb)xb.addEventListener('click',leaveNow);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.key==='Esc')leaveNow();
});
</script>
