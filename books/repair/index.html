BODIES[1]=`
<p>You searched for something and found this.</p>
<p>It is worth pausing on, because almost nobody does. Most people who could be reading this page will never type the words &mdash; not because they don&rsquo;t suspect, but because the suspicion is unbearable and there are a hundred easier things to think about. You typed it anyway.</p>
<p>That counts. It counts for less than you want it to, and it is currently the only thing about you that counts at all.</p>
<h3>What this book is for</h3>
<p>One thing: <strong>that the people around you have a different year than the last one.</strong></p>
<p>Not that you feel better. Not that you understand yourself. Not that you are forgiven, or seen fairly, or able to explain. Those may happen and they are not the objective, and whenever this book has to choose between them and the objective, it will choose the objective.</p>
<p>That is going to be uncomfortable in places. It is uncomfortable on purpose, and not because discomfort is good for you &mdash; because the comfortable version of this book would not work.</p>
<div class="pull">Everything here is measured in what stops happening to somebody else. Nothing is measured in how you feel about it.</div>
<h3>The thing to watch for, starting now</h3>
<p>If you finish a chapter feeling <em>better</em>, stop and check what you did with it.</p>
<p>Relief is the failure mode of this entire book. It is what almost everyone gets from material like this: a sense of being understood, a name for the thing, a category to sit in &mdash; and then nothing changes, and six months later they are the same person with better vocabulary. That outcome is worse than not reading it, because it converts a live problem into a settled one.</p>
<p>So relief here is a symptom, not a result. When it arrives, the question is not <em>do I understand now</em> but <em>what did I do differently</em>. That question will be asked repeatedly and it will not get less annoying.</p>
<h3>What you will not find</h3>
<p>No programme with stages. No community. No practitioner to hire at the end. Nothing to buy anywhere in it, and no next book.</p>
<p>Nothing here keeps score. There is no progress bar, no record that you visited, no way for this to tell you it has been a while. It does not know you are reading it and cannot tell whether you finish. That is deliberate, and by the end of chapter forty-seven you will understand exactly why a book like this one has to be built that way.</p>
<h3>How long this takes</h3>
<p>The reading is a few hours. The rest is measured in years, most of them undramatic, and nobody will notice most of it. That is not a warning designed to test your commitment. It is the actual shape of the thing.</p>
<p>If you want the two chapters that matter most before anything else: chapter two, because it removes the two exits you will otherwise take within the week &mdash; and chapter thirty-seven, immediately and before anything, if there is any chance of somebody getting seriously hurt in the next few days.</p>
`;

BODIES[2]=`
<p>Within about a week, one of two sentences is going to arrive. Possibly both, alternating. They will feel like conclusions and they are exits.</p>
<h3>Exit one: I&rsquo;m a monster</h3>
<p>This one feels like the honest option. It feels like facing it. It is usually the first to arrive and it arrives with a lot of feeling attached, which is part of why it is convincing.</p>
<p>Look at what it actually does. <em>Monster</em> is an identity, and identities are static. If it is what you <strong>are</strong>, there is nothing to do about it &mdash; you can only be it, apologise for it, and be comforted about it. Which is why this exit reliably ends with somebody consoling you, and why the person doing the consoling is so often the person you harmed.</p>
<p>It also has a quieter benefit, and this is the part people miss. If you are a monster, then the specific things you did stop mattering. They collapse into the general fact of your nature, and a general fact requires no inventory, no list, no going through it item by item. The exit that feels like the harshest judgement is also the one that lets you skip movement two.</p>
<h3>Exit two: I&rsquo;m actually fine</h3>
<p>This one arrives later and more quietly, usually after you have read enough to have some vocabulary.</p>
<p>It sounds like: it was a hard period. She was doing things too. Everyone argues. I never hit anyone. That is not what that word means. I&rsquo;ve met people who are actually like that and I am not one of them.</p>
<p>Some of those sentences will be true. That is what makes this exit durable &mdash; it is built out of accurate materials. But notice the shape: it is a <em>complete</em> account, with a remainder of zero. Nothing is left unexplained, which means nothing is left to change.</p>
<div class="pull">Both exits are more comfortable than the third position. That is how you can tell they are exits.</div>
<h3>The third position</h3>
<p>You are a person who did specific things, repeatedly, that harmed specific people.</p>
<p>Read it again, because every word is doing work. <strong>Specific things</strong> &mdash; not a nature, a list. <strong>Repeatedly</strong> &mdash; not an incident, a pattern. <strong>Specific people</strong> &mdash; not harm in the abstract, named individuals with a Tuesday you ruined.</p>
<p>That is a <em>record</em>, not an identity. And the difference is entirely practical rather than philosophical:</p>
<ul>
<li>An identity is a claim about what you are, which cannot be worked on and can only be confessed or denied.</li>
<li>A record is a claim about what happened, which is fixed going backward and open going forward.</li>
</ul>
<p>Nothing you do from here changes a single entry in the existing record. Nothing. This book will not pretend otherwise at any point, and if you catch it seeming to, it has drifted.</p>
<p>What is available is that the record stops growing. That is a smaller offer than redemption and a larger one than nothing, and it is the whole of what is on the table.</p>
<div class="warn"><span class="k">One clarification, because this will be misused</span>
&ldquo;A record, not an identity&rdquo; is not a softening. It is not <em>so I&rsquo;m not really that kind of person</em>. The record is worse than the identity in one specific way: an identity is vague and a record is itemised. Movement two is where you itemise it.</div>
<h3>Why this chapter is second</h3>
<p>Because both exits are available immediately, both feel like insight, and taking either one ends the work before it starts &mdash; while producing, in the person who took it, the confident sense of having done something.</p>
<p>You will reach for one of them. Probably more than once, and probably at the exact point where the material gets specific. When you notice it happening, the useful move is not to argue yourself out of it. It is to notice <em>what you stopped doing</em> the moment the sentence arrived.</p>
`;

BODIES[3]=`
<p>Chapter two was about two identities. This one is about two behaviours, and they are what the identities produce when other people are in the room.</p>
<h3>The confession</h3>
<p>It is enormous. It is tearful, or shaking, or very quiet and very intense. It uses the words &mdash; abusive, controlling, what I did to you. It may be the most honest you have ever been out loud, and the feeling accompanying it is usually real.</p>
<p>Watch what happens next.</p>
<p>They comfort you. Almost every time. They put a hand on your arm, or they say it wasn&rsquo;t all bad, or they get frightened by the size of it and start managing you. And within twenty minutes the subject is no longer what you did &mdash; it is how you are doing, whether you&rsquo;re all right, whether they should be worried.</p>
<p>The confession achieved something. It just was not the thing it appeared to be.</p>
<div class="pull">At the end of the conversation, ask one question: <b>whose distress was being managed?</b> If it was yours, the confession was for you, however true every word of it was.</div>
<h3>Why this one is more damaging than denial</h3>
<p>Denial is at least legible. They know where they stand, they know nothing is going to change, and they can plan accordingly. It is bad and it is honest about being bad.</p>
<p>The confession is worse because it <strong>looks like the thing they have been waiting years for.</strong> It arrives with all the markings of a turning point. So they update &mdash; they let go of some vigilance, they tell a friend it might be different, they let themselves imagine a version of the next few years that is not the last few.</p>

<p>Take your list. Rewrite the entries as if they were about someone else &mdash; a colleague&rsquo;s partner, a friend&rsquo;s brother, a man described to you by someone you believe. Same acts, same frequency, same duration. Different name.</p>

<p>You have spent years developing a fair, contextual, generous reading of your own behaviour, and that reading is not available for anyone else&rsquo;s. It is not that you are dishonest. It is that you have access to a quantity of mitigating information about yourself &mdash; your intentions, your history, your reasons, your bad week &mdash; that you have never had about any other person you have ever judged.</p>

<p><em>The Weighing</em> gives four dimensions for turning incidents into a finding. They were written for someone assessing another person. Run them on yourself.</p>
<h3>The four</h3>
<p><strong>Frequency.</strong> How many times, in what window? Not &ldquo;sometimes&rdquo; &mdash; a number, even a rough one. People are consistently wrong in both directions here, and the wrongness is informative: readers who have been minimising find a bigger number than expected, and readers in a shame spiral find a smaller one.</p>
<p><strong>Duration.</strong> Over what span? Six weeks during a bereavement and six years are different objects wearing the same description. If the answer is years, note that the person on the other end has been adapting to it for years, which is a different situation from enduring it.</p>
<p><strong>Escalation.</strong> Was it growing &mdash; in frequency, in severity, in how much of their life it reached? This is the most predictive of the four, and it is the one that determines whether chapter thirty-seven applies to you today.</p>

<p>This movement is where the book becomes most useful and most dangerous, so the rule for reading it comes first.</p>
<div class="pull">A <b>cause</b> tells you what to change. An <b>excuse</b> tells you not to. The same sentence can be either, and the difference is not in its accuracy \u2014 it is in what it produces next.</div>
<h3>The same sentence, twice</h3>
<p><em>&ldquo;I do this when I&rsquo;m frightened of losing her.&rdquo;</em></p>
<p>As a cause: so the work is on what happens when that fear arrives \u2014 recognising it earlier, leaving the room, and separately, looking at why the fear is that size. There is something to do on Thursday.</p>
<p>As an excuse: so it is understandable, so it is not really about her, so it will presumably stop when the fear does. There is nothing to do on Thursday.</p>
<p>Identical sentence. Possibly true in both cases. Completely different function, and only the person saying it can tell which one it is doing.</p>
<h3>The test</h3>
<p>Ask, of any explanation you produce in the next eight chapters:</p>
<div class="try"><span class="k">The test</span>
<p style="margin:0"><em>What does this tell me to do differently, and by when?</em></p>
<p style="margin:10px 0 0">If there is an answer \u2014 a specific thing, this week \u2014 you are holding a cause. If the answer is a feeling, an understanding, or a sense of the situation being clearer, you are holding an excuse, regardless of how accurate it is.</p></div>
<p>Accuracy is genuinely not the criterion. This is the thing that surprises people. A completely correct account of where your behaviour came from is functioning as an excuse if it terminates in comprehension. And a partial, rough account is functioning as a cause if it produces an action.</p>
<h3>Why bother with this movement at all</h3>
<p>Two arguments say to skip it, and both are wrong in the same way.</p>
<p>The first: <em>causes don&rsquo;t matter, only behaviour does.</em> This is the position of most court-mandated material and it fails in practice, because behaviour that is not understood recurs in a new form. A person who stops shouting without knowing what the shouting was doing tends to find a quieter mechanism that achieves the same thing.</p>
<p>The second: <em>understanding is the work.</em> This is the position of a great deal of therapy and it fails more often, because insight is pleasant and produces the strong sensation of progress while nothing changes. You can spend four years becoming extremely well-informed about your own psychology and be exactly as difficult to live with.</p>
<p>The position of this movement is narrower than either: <strong>understand it only as far as is required to change it, then stop.</strong> There is a point past which further explanation adds nothing operational, and past that point it becomes an activity.</p>
<h3>The order of the next seven chapters</h3>
<p>What you were taught. Fear. What you were getting. Power you did not notice. The story you told yourself. Substances and exhaustion. Whether you have a condition.</p>
<p>They are roughly ordered from most distant to most immediate. The early ones explain the shape you arrived with; the later ones explain the specific Thursday. Most readers find that one or two of the seven do nearly all the work, and that they can identify which within a paragraph or two of arriving.</p>
<p>One caution before starting. Every chapter here ends by pointing at something changeable. If you reach the end of one and find you have collected an explanation and no action, go back and run the test.</p>

<p>You learned this somewhere. Not the specific acts \u2014 the underlying grammar: what an argument is for, what a &ldquo;no&rdquo; means, whether affection is a resource that can be withheld, what happens when someone in the house is angry.</p>

<p>Not values. Values are stated out loud and are frequently the opposite of what gets learned. What transmits is <strong>procedure</strong> \u2014 the sequence of moves a room performs when something goes wrong.</p>

<li><strong>What a refusal means.</strong> A boundary to be respected, or an opening position to be worked on?</li>

<li><strong>Who was responsible for the mood.</strong> If one person&rsquo;s state set the weather for the house, you learned both roles.</li>
<li><strong>What happened to the person who raised something.</strong> This one predicts more than the others combined.</li>

<p>The question is simple. <strong>What were you getting?</strong></p>
<p>Nobody sustains a behaviour for years that returns nothing. Behaviour that produces nothing extinguishes. Yours did not extinguish, which means it was paying.</p>
<h3>The honest list</h3>
<p>Read it slowly and notice which ones produce an objection.</p>
<ul>
<li><strong>Compliance.</strong> Things going the way you wanted, without a negotiation.</li>
<li><strong>The argument ending on your terms.</strong> Not resolution \u2014 cessation, in your favour.</li>
<li><strong>Being right.</strong> Not being correct. The state of having been established as the one who is right.</li>
<li><strong>Certainty.</strong> Knowing where they were, who they were with, what they thought. Chapter seventeen.</li>

<p>The standard responses are <em>I wanted us to be okay</em>, <em>I wanted her to understand</em>, <em>I was trying to hold the family together</em>.</p>

<p>There will be someone new. This chapter is about what they are owed and when, and about the two errors.</p>
<h3>The first error: concealment</h3>
<p>Saying nothing, indefinitely, on the grounds that it was the past and this is different.</p>
<p>The problem is not moral. It is that they are making a decision about their life with a material fact withheld \u2014 and the specific fact withheld is one about your conduct toward the person in the position they now occupy.</p>
<p>There is also a practical problem: it makes the disclosure, whenever it comes, much worse. A fact revealed at month three is information. The same fact revealed at year four is a concealment, and the concealment becomes the subject.</p>
<h3>The second error: disclosure as absolution</h3>
<p>More common among readers of a book like this, and harder to see.</p>
<p>The confession arrives early and at length. It is honest, it is detailed, it uses the vocabulary. And it produces the response from chapter three: they reassure you, they say it is brave, they tell you that you are clearly not that person now.</p>
<p>You have obtained, from someone who was not there, an absolution that the person who was there did not give. And you have made a new relationship carry your history in its first month.</p>
<div class="pull">Disclosure that ends with you being reassured was not disclosure. It was chapter three, delivered to somebody who did not know what they were participating in.</div>
<h3>The workable version</h3>
<p><strong>When:</strong> before the relationship becomes something they would be materially harmed by leaving \u2014 before moving in, before a child, before finances merge. Not the third date, which is a disclosure to a stranger. Not the fourth year.</p>
<p><strong>What:</strong> plainly. That a previous relationship ended because of how you behaved, in specific terms \u2014 controlling, or whatever the accurate word is \u2014 that you have done substantial work on it, and that you are telling them because they should have it.</p>
<p><strong>How:</strong> without detail they did not ask for, without the reasons from movement three, and without a request. Then let them ask whatever they want, and answer it without softening.</p>
<p><strong>And then leave it.</strong> Do not check how they are with it. Do not revisit it to be reassured. If they need time, they get time.</p>
<h3>Month four</h3>
<p>The part that matters more than the conversation.</p>
<p>The pattern does not respect the fact that this person is different or that you have done the work. What it responds to is the same conditions: intimacy, dependency, fear of loss, and the point at which they start having their own opinions about things.</p>
<p>The markers to watch, honestly:</p>
<ul>
<li>The narration from chapter twenty starting up about a new person.</li>
<li>A subject that has begun to be expensive \u2014 chapter twelve, from the beginning.</li>
<li>Commentary about their friends or family. This is the earliest reliable sign.</li>
<li>Your reaction to their independence \u2014 their plans, their money, their time.</li>
<li>Reaching for a thing you know would land, and enjoying knowing it.</li>
</ul>
<p>Which is why chapter thirty-five continues into a new relationship. Somebody outside still knows, still hears, and is still able to say the sentence you will not say to yourself.</p>

BODIES[46]=`
<p>Both identities come back. Usually years later, usually when something has gone wrong, and usually with better material than they had the first time.</p>
<h3>The return of &ldquo;monster&rdquo;</h3>
<p>It arrives after a lapse, or on an anniversary, or when something reminds you of a specific evening you had managed not to think about.</p>
<p>It is the same object as chapter two: static, therefore nothing to do, therefore comfortable. And it is more persuasive at year five than it was at week one, because you now have the full list, the reconstruction, and an accurate sense of what was taken.</p>
<p>What it produces is a period of feeling terrible, followed by nothing changing, followed by relief. It is an experience, and it is available whenever an experience is wanted.</p>
<h3>The return of &ldquo;fine&rdquo;</h3>
<p>Quieter and much more likely.</p>
<p>Time has passed. The behaviour stopped years ago. Nothing has happened for a long while. And the account begins, without any decision being made, to soften: it was a bad period, both of you were struggling, it was not as extreme as it seemed at the time, you have certainly overcorrected.</p>
<p>This is not dishonesty. It is what accounts do when nothing contests them, and it is exactly why chapter seven said to write the list down rather than hold it. The list does not soften.</p>
<div class="pull">In ten years the only thing that will still say plainly what happened is the document you wrote in chapter seven. Keep it.</div>
<h3>What to hold instead</h3>
<p>The same sentence, unchanged since chapter two: <strong>a person who did specific things, repeatedly, that harmed specific people \u2014 and who does not, now.</strong></p>
<p>Both halves. The first without the second is exit one. The second without the first is exit two.</p>
<p>What is notable about that sentence is how little identity it contains. It is a description of conduct across two periods. That is deliberate: a person who has built an identity out of this \u2014 in either direction \u2014 has made the thing about themselves again, and there is a version of that which is genuinely worse than denial, because it is sustainable and articulate and can go on for decades.</p>
<h3>The people who will insist</h3>
<p>Some will require you to be one version. Family who want it minimised, because the alternative is uncomfortable for them. Someone in your life who finds the redeemed-man story appealing. Occasionally someone who needs you to be the monster because it organises something for them.</p>
<p>None of those are assessments. They are needs, and you are not obliged to meet any of them \u2014 which is different from arguing with them. You can let people hold their version without adopting it and without correcting it. Chapter forty-four.</p>
<h3>What this is for</h3>
<p>Both identities end the work. The reason to refuse them is not accuracy or humility. It is that at year eight, with nobody watching and nothing at stake, the only thing keeping the conduct in place is a clear-eyed account of what happened \u2014 and both identities are ways of not having one.</p>
`;

BODIES[47]=`
<p>This book can be used by someone who has not changed, as evidence that they have. That is not a hypothetical risk. It is the most likely misuse and it needs a chapter.</p>
<h3>What it looks like</h3>
<ul>
<li><strong>Citing it in arguments.</strong> Any sentence beginning <em>I&rsquo;ve been reading about this and&hellip;</em> in the middle of a disagreement. The vocabulary has become a weapon, which is a specific chapter in <em>The Weighing</em> and applies here in its purest form.</li>
<li><strong>Telling them you are reading it.</strong> There is no version of this that is not a bid. It says: notice that I am working, adjust your assessment. It asks them for credit against work they cannot verify.</li>
<li><strong>Fluency without change.</strong> You can describe the pattern precisely, name your own mechanisms, discuss the payoff \u2014 and the list has not had a new entry because you stopped keeping it, not because there is nothing to record.</li>
<li><strong>Reframing.</strong> Using the material to produce a better account of the same events. <em>What was really happening was that I was frightened of losing her</em> \u2014 accurate, from movement three, and being deployed to change how the years are described.</li>
<li><strong>The book as the work.</strong> Reading is the activity. It happens in the evenings, it feels serious, and nothing outside the reading is different.</li>
<li><strong>Producing it as evidence.</strong> In a hearing, a family meeting, a conversation with her parents. Chapter five said this and it is worth saying twice.</li>
</ul>
<div class="pull">A person can hold every idea in this book accurately and be exactly as difficult to live with. Insight is not a stage of change. It is a separate thing that can happen instead of it.</div>
<h3>The test</h3>
<p>It has three parts and the third is the one that makes it a test.</p>
<div class="try"><span class="k">The shield test</span>
<ul style="margin:0 0 0 18px">
<li><b>Behaviour</b> \u2014 not understanding, not remorse, not how you have been thinking about it.</li>
<li><b>Over months</b> \u2014 not this week, not since the argument.</li>
<li><b>Measured by them</b> \u2014 or, where there is no contact, by the person in chapter thirty-five. <b>Not by you.</b></li>
</ul>
<p style="margin:10px 0 0">The third condition is the whole thing. Every reader can produce a favourable self-assessment; that capacity is what movements two and three were about. If the only person who thinks you have changed is you, the test has not been run.</p></div>
<h3>The recursive problem</h3>
<p>A reader can use this chapter as a shield. <em>I&rsquo;ve read the chapter about people who use it as a shield, so I&rsquo;m clearly not one of them.</em></p>
<p>There is no way to write around that, so the only defence is external: the test cannot be self-administered. That is not a stylistic choice \u2014 it is the reason chapter thirty-five is not optional, and the reason this book keeps pointing outward at a person who is not you.</p>
<h3>If you fail it</h3>
<p>You may be reading this and recognising several items. That is common and it is not the end of anything.</p>
<p>What it means is specific: the work has been happening in the wrong place. It has been happening in your head, where it is pleasant and legible and produces the sensation of progress, and it has not been happening in movement five, where it is unpleasant and unobserved and produces nothing to feel.</p>
<p>Go back to chapter thirty-one. Remove one condition, this week. Tell the person in chapter thirty-five what you found in this chapter.</p>
<p>That is the correction, and it is smaller than the recognition feels.</p>
`;

BODIES[48]=`
<p>Not redemption. There is no mechanism in this book that produces it and no chapter that offered it.</p>
<p>Not nothing either, which is the other thing people arrive expecting.</p>
<h3>What is actually available</h3>
<p>A life in which the thing does not happen.</p>
<p>Stated plainly it sounds like very little, and it is the largest thing on offer. Somewhere there is a person &mdash; possibly someone you have not met yet &mdash; who will spend several years near you and never learn what this is. They will not know they were spared anything. There will be no moment in which you are credited, because nothing will have occurred.</p>
<p>That absence is the entire product. Everything in these forty-eight chapters was aimed at producing a series of things that do not happen, to people who will never know the alternative.</p>
<div class="pull">Nobody is going to congratulate you for this. The evidence of it is a set of ordinary evenings that were not ruined, and ordinary evenings leave no record.</div>
<h3>What you can be</h3>
<p>Not innocent. That is gone, permanently, and every chapter here has assumed it.</p>
<p>What is available is more specific and less consoling: <strong>someone who did that, and does not now, and will not.</strong> Held plainly, without either identity, for the rest of your life &mdash; which is chapter forty-six, and which is the actual work once the dramatic part is over.</p>
<p>You can also be useful. Not as a spokesman &mdash; chapter forty-one covers why that shape goes wrong &mdash; but in the narrower, quieter way that people who know something are useful. You can decline to laugh. You can not pass it on to a child. You can be the man in the room who does not do the thing, at the moment when everyone is doing it, and say nothing about why.</p>
<h3>The last thing</h3>
<p>You came here because you recognised yourself in a description and could not put it down.</p>
<p>Almost nobody gets that far. Of the people who could be reading this page, most will never type the words, and of those who do, most will find one of the two exits within a fortnight because both are so much easier than the middle.</p>
<p>If you are still here, you have already done something unusual, and it still does not count for very much, because the counting is not done in reading.</p>
<p>It is done in a kitchen, on a Thursday, in eighteen months, when something has gone wrong and you are tired and the sentence from chapter eight arrives on time &mdash; and you put your coat on and go out for half an hour instead.</p>
<p>Nobody will see it. They will just have an ordinary evening.</p>
<p>That is the whole of it. Go and have the ordinary evening.</p>
`;

  '<div class="helprow"><h3>For the person you did this to</h3><p>They have their own routes, and they are not through you. A domestic abuse helpline (<b>&ldquo;[your country] domestic abuse helpline&rdquo;</b>) and, in this library, <i>The Long After</i> and <i>Sovereign</i>. Passing this row on is not amends and is not a substitute for anything in movement six.</p></div>'+
  '<div class="helprow"><h3>What none of this discharges</h3><p>The record. Getting help is a thing you do because it makes you stop, and it is measured the way everything else in this book is measured: by the people affected, over months. Reading this page is not the doing of it.</p></div>'+
  '</div>'+
  '<div class="pager"><a href="#/"><span class="k">&larr; Back</span>All forty-eight chapters</a>'+
  '<a class="nx" href="#/card"><span class="k">Next &rarr;</span>Appendix A &mdash; the card</a></div>'+
  '</section></div>';
}

function route(){
  var app=document.getElementById('app'),out;
  var p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='c'&&CH[+p[1]])out=chapter(+p[1]);
  else if(p[0]==='help')out=help();
  else if(p[0]==='card')out=card();
  else if(p[0]==='limits')out=limits();
  else out=hub();
  app.innerHTML=out;
  window.scrollTo(0,0);
  document.title=(p[0]==='c'&&CH[+p[1]])?CH[+p[1]].t+' \u2014 The Repair':'The Repair \u2014 for the person on the other side of it';
}
window.addEventListener('hashchange',route);
route();

var db=document.getElementById('darkbtn');
db.addEventListener('click',function(){
  var on=document.documentElement.classList.toggle('dark');
  db.setAttribute('aria-pressed',String(on));
  db.textContent=on?'Light':'Dark';
});
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  var m=(location.hash||'').match(/^#\/c\/(\d+)/);if(!m)return;
  var n=+m[1];
  if(e.key==='ArrowRight'&&CH[n+1])location.hash='#/c/'+(n+1);
  if(e.key==='ArrowLeft'&&CH[n-1])location.hash='#/c/'+(n-1);
});

/* ---- Leaving in a hurry -------------------------------------------------
   Esc, or the Leave button, blanks the page and navigates away without
   adding a history entry. No storage is touched, because there is none. --- */
/* about:blank, not an outside site: this file is offline-first and its own
   house rule forbids external URLs. Blanking works with no network. */
var EXIT_URL='about:blank';
function leaveNow(){
  try{document.documentElement.innerHTML='';}catch(e){}
  try{location.replace(EXIT_URL);}catch(e){location.href=EXIT_URL;}
}
var xb=document.getElementById('exitbtn');
if(xb)xb.addEventListener('click',leaveNow);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.key==='Esc')leaveNow();
});
</script>
