BODIES[1]=`
<p>You left. Somewhere in the culture around you, that was supposed to be the ending \u2014 the moment in the story where the danger stops and the healing music starts.</p>
<p>For a lot of people, it isn't. It's closer to the middle. The relationship is over, and something else has begun: a longer, quieter, less-discussed period where the coercion doesn't stop so much as it changes shape, where your body hasn't caught up with the fact that you're safer now, and where the people around you are often confused about why you're not simply relieved.</p>
<div class="pull">If leaving didn't feel like the ending you were promised, that isn't a sign you did it wrong. It's a sign the promise was incomplete.</div>
<h3>What this book is for</h3>
<p>The part that comes after. Not "how to leave safely" \u2014 that's covered elsewhere, including in <em>Sovereign</em>, this library's book for women untangling exactly this kind of relationship. This book starts at the door and stays with you for the years afterward: the specific, documented ways coercion continues once direct contact is restricted, the practical systems that exist to help, what your body and mind are actually doing, and what rebuilding really looks like when nobody's filming it for a highlight reel.</p>
<h3>Who this is for</h3>
<p>Anyone who has left, at any distance in time \u2014 last week, or eight years ago and finding a chapter here still lands. Some of the recognition material may also be useful if you're still deciding, as an honest preview rather than a reason to stay or go.</p>
`;

BODIES[2]=`
<p>Here's a fact worth knowing in advance, because finding it out the hard way is worse: for many people, things get more difficult, not less, in the period right after leaving \u2014 before they get better.</p>
<h3>Why this happens</h3>
<p>Coercive control is, at its core, about maintaining control. Leaving removes a huge amount of it, all at once, and the loss of control is well documented to provoke escalation in exactly the period immediately following separation \u2014 more contact attempts, more conflict, sometimes more risk, precisely when you might have expected things to calm down.</p>
<div class="warn"><span class="k">This is not about discouraging leaving</span>
This book exists for people who have already left. If you're currently deciding whether to leave a dangerous situation, this chapter is not a reason to stay \u2014 the resources in <em>Sovereign</em> and elsewhere in this library, and local domestic-abuse services, are the right place for that decision. This chapter is for making sense of what you're already experiencing, having already left.</div>
<h3>What this isn't evidence of</h3>
<p>It is not evidence that you left badly, or too soon, or that you made a mistake. It's a documented pattern, driven by the other person's loss of control rather than by anything you did or didn't do correctly. Knowing this in advance is most of what this chapter can offer \u2014 not because it makes the difficulty smaller, but because it removes the added weight of thinking you're the reason it's hard.</p>
`;

BODIES[3]=`
<p>You might miss them. Sometimes. At specific times \u2014 a certain time of evening, a smell, a song. You might feel a flash of tenderness remembering something genuinely good, alongside a clear, unwavering knowledge that leaving was right. You might feel relief and grief in the same hour, sometimes in the same breath.</p>
<h3>All of it is allowed</h3>
<p>None of these feelings, alone or together, are evidence that the relationship wasn't harmful, or that you're secretly still attached to something bad, or that some part of you wants to go back. Human attachment doesn't switch off cleanly just because the person attached to caused harm \u2014 in fact it often doesn't, and that's not a flaw in you.</p>
<div class="pull">Missing someone who hurt you is not the same as wanting them back. You're allowed to hold both without either one cancelling the other.</div>
<h3>Why this needs saying explicitly</h3>
<p>Because a lot of well-meaning people around you \u2014 friends, family, sometimes even professionals \u2014 expect a cleaner emotional story than the one you're actually living. They expect relief, maybe some sadness, and then a fairly linear path to being fine. When your actual feelings don't match that story, it's easy to conclude something's wrong with you, rather than concluding the expected story was too simple.</p>
<h3>No timeline</h3>
<p>This book will not tell you when these feelings should resolve, because there isn't a reliable answer, and any specific number would be more comforting than true. What's available instead is permission: however long this takes, and however contradictory it feels along the way, it's not evidence you're doing it wrong.</p>
`;

BODIES[4]=`
<p>There's a grief in this that almost nobody around you will let you have, because almost everyone who knows what happened only sees the harm, and expects relief rather than mourning.</p>
<h3>What you might actually be grieving</h3>
<p>Not necessarily the person, though sometimes that too. More often: the relationship you hoped it would be. The future you'd planned around it. The version of them you fell for, which may have been genuinely real some of the time, even alongside everything that wasn't. Years of your life invested in something that didn't become what you needed it to be.</p>
<div class="pull">You can grieve the loss of something that was also harming you. Those two facts don't cancel out, and needing to mourn one doesn't mean you're confused about the other.</div>
<h3>Why people dismiss this grief</h3>
<p>Usually with good intentions: "but they were awful to you," said as though that settles the matter, as though grief requires its object to have been uncomplicatedly good. It doesn't. People grieve difficult parents, complicated marriages, relationships that were genuinely bad for them, all the time \u2014 this is not unusual, even though it's rarely acknowledged directly.</p>
<h3>What to do with it</h3>
<p>Let it be what it is, without needing anyone else's permission or understanding for it to be legitimate. If the people around you can't hold this complexity, that's a real gap \u2014 and chapter twenty-seven, on finding the right kind of support, exists partly because of exactly this gap.</p>
`;

BODIES[5]=`
<p>Before anything else, some honest boundaries about what this book is not.</p>
<h3>Not a substitute for therapy</h3>
<p>Where real, sustained psychological support is warranted \u2014 and for a lot of people navigating this, it is \u2014 a book, however thorough, is not that. Chapter twenty-seven covers finding a therapist who's actually suited to this specific situation.</p>
<h3>Not a universal timeline</h3>
<p>You will not find a promise here that by six months, or a year, or five years, you'll feel a specific way. Every timeline offered as universal in this territory is wrong for a meaningful number of the people reading it, and this book would rather be honestly vague than falsely precise.</p>
<h3>Not a verdict on when you're "over it"</h3>
<p>There is no chapter that tells you whether you've recovered enough, moved on enough, or processed enough. Chapter forty-one offers a working definition of recovery, and it's deliberately not framed as a finish line you either have or haven't crossed.</p>
<div class="warn"><span class="k">One more boundary, stated now and covered fully later</span>
This book will not, anywhere, provide any detail about methods of self-harm, and if what you're experiencing has moved beyond difficult into something that feels like a genuine crisis, chapter twenty-eight is written specifically for that, with real, calm, practical routes to help. You don't need to wait until chapter twenty-eight to use them &mdash; if that's where you are right now, go there directly.</div>
`;

BODIES[6]=`
<p>Direct contact has been restricted, cut off, or made rare. And yet something in the pattern continues \u2014 different in shape, sometimes hard to name, but recognisably the same underlying thing.</p>
<h3>The general mechanism</h3>
<p>Coercive control isn't primarily about the specific method used. It's about maintaining influence and leverage over another person. When one channel closes, a person determined to maintain that influence tends to find another \u2014 not necessarily through conscious strategic planning, but because the underlying drive hasn't gone anywhere just because the relationship has ended.</p>
<div class="pull">This is why "just go no-contact" is sometimes real, complete protection, and sometimes only closes one door while several others remain open. Recognising the shape in its new form matters as much as recognising it in the old one.</div>
<h3>Why this gets missed</h3>
<p>Because it looks different enough from the original pattern that even the person experiencing it \u2014 and sometimes professionals meant to help \u2014 can miss the connection. A custody dispute doesn't look like the arguments that happened at home. A financial complication doesn't look like being monitored. But run the same test used elsewhere in this library: does it function to maintain control and unsettle you, regardless of its shape? The chapters ahead cover the specific channels this commonly takes.</p>
`;

BODIES[7]=`
<p>If there are children, this is very likely the channel you'll encounter, and it's the one requiring the most care \u2014 because the wrong response can cause real harm to the children themselves.</p>
<h3>Specific tactics</h3>
<ul>
<li><strong>Using custody exchanges as contact opportunities</strong> \u2014 extended conversations, questions, or confrontations at drop-off and pick-up that go beyond what the exchange requires.</li>
<li><strong>Extracting information via children</strong> \u2014 asking them detailed questions about your life, your home, your relationships, and using what they share.</li>
<li><strong>Undermining you to the children</strong> \u2014 comments designed to damage the relationship between you and them, sometimes subtle, sometimes not.</li>
<li><strong>Using scheduling as leverage</strong> \u2014 last-minute changes, delays, or rigid enforcement of minor terms specifically timed to disrupt your life.</li>
</ul>
<div class="warn"><span class="k">The priority, stated plainly</span>

BODIES[40]=`
<p>Will you get back to who you were before all of this? The honest answer is more nuanced than either a comforting yes or a bleak no.</p>
<h3>What's genuinely recoverable</h3>
<p>A great deal, often more than it feels possible early on: your sense of humour, your capacity for joy, your ability to trust and connect, your confidence in your own judgement. These do come back for most people, though rarely in a straight line and rarely on a predictable schedule.</p>
<h3>What isn't, quite</h3>
<p>A version of you with no knowledge of what you now know, no memory of what happened, no changes at all from the experience \u2014 that person genuinely isn't coming back, and treating full restoration to a pre-relationship self as the goal sets up a standard that isn't actually available to anyone who's lived through something significant.</p>
<div class="pull">"Getting back to normal" is the wrong frame. What's actually available is a third thing: a version of you that carries this experience, has integrated real and hard-won knowledge from it, and is not lesser for the difference &mdash; often, in specific ways, wiser and more discerning than the person who went into the relationship.</div>
<h3>Why this reframe matters</h3>
<p>Chasing full restoration to an earlier self sets an unreachable target and produces a permanent sense of falling short. Accepting a genuinely new version of yourself, built from what's recoverable plus what's been learned, is both more accurate and considerably more achievable.</p>

<p>A working, concrete definition of recovery, stated plainly, because "you'll know it when you feel it" isn't a standard anyone can actually use.</p>
<h3>What recovery is not</h3>
<p>The complete absence of difficult feelings, memories, or occasional hard days. Nobody, including people who've navigated this successfully by any reasonable measure, reaches a state with none of that remaining.</p>
<h3>What it actually is</h3>
<div class="pull">The restoration of choice and capacity. The ability to make decisions from a place of genuine agency rather than fear or old habit, to trust your own judgement again, to want things and pursue them, to be present in new relationships without the past constantly intruding on them.</div>
<h3>Concrete markers, rather than a feeling-based standard</h3>
<ul>
<li>You can make a decision without needing to run it past what your ex would have thought of it.</li>
<li>Difficult days happen and pass, rather than defining extended stretches of your life.</li>
<li>You can be curious about new people and situations, not just wary of them.</li>
<li>Your sense of your own judgement has meaningfully returned, even if it isn't fully what it once was.</li>

<p>None of these require perfection, and none of them mean the difficult feelings from earlier chapters never arise again. They mean those feelings have stopped running the show.</p>

<p>Published rather than buried, per the standard this library holds itself to throughout.</p>
<h3>What is well evidenced</h3>
<p>That risk and conflict often elevate in the period immediately following separation, for structural reasons related to loss of control. That hoovering \u2014 renewed contact timed to a victim's visible stability \u2014 is a documented, named pattern. That hypervigilance, sleep disruption, and memory effects of sustained stress and trauma are well established in the broader trauma literature. That many people who eventually leave for good have left and returned at least once previously.</p>

<p>The degree of variance in family court systems' recognition of coercive control specifically is real but the pace and consistency of improvement is genuinely disputed among family-law specialists across different jurisdictions. Precisely how common "going back" is varies across different studied populations and is not a single settled figure.</p>
<h3>What is this book's inference</h3>
<p>The specific conversational guidance in the chapters on children, parents, and new partners \u2014 drawn from what's reportedly worked, not controlled study. The working definition of "recovered" in chapter forty-one, which reflects this book's judgment about a useful, concrete standard rather than a clinically validated one.</p>
<h3>The biggest risk this book carries</h3>
<p>That the general patterns described throughout \u2014 particularly in movement two \u2014 won't match every reader's specific experience, and jurisdiction and individual variance are larger than any single book can fully capture. A reader whose situation differs from the general pattern described here is not thereby less valid or less real; they should trust their own specific experience over this book's generalisations wherever the two seem to diverge.</p>
<h3>What would change its mind</h3>
<ul>
<li>If post-separation risk elevation were shown to be substantially overstated relative to steady-state relationship risk, chapter two's framing would need revising.</li>

  '<li>If the conversational approaches in movement five performed no better than alternatives, that material would need '+
  'reconsidering.</li></ul>'+
  '</div>'+
  '<div class="pager"><a href="#/card"><span class="k">&larr; Previous</span>Appendix A &mdash; the card</a>'+
  '<a class="nx" href="#/"><span class="k">Back &rarr;</span>All forty-five chapters</a></div>'+
  '</section></div>';
}

function route(){
  var app=document.getElementById('app'),out;
  var p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='c'&&CH[+p[1]])out=chapter(+p[1]);
  else if(p[0]==='card')out=card();
  else if(p[0]==='limits')out=limits();
  else out=hub();
  app.innerHTML=out;
  window.scrollTo(0,0);
  document.title=(p[0]==='c'&&CH[+p[1]])?CH[+p[1]].t+' \u2014 The Long After':'The Long After \u2014 what happens once you\u2019ve left';
}
window.addEventListener('hashchange',route);
route();

var db=document.getElementById('darkbtn');
db.addEventListener('click',function(){
  var on=document.documentElement.classList.toggle('dark');
  db.setAttribute('aria-pressed',String(on));
  db.textContent=on?'Light':'Dark';
});
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  var m=(location.hash||'').match(/^#\/c\/(\d+)/);if(!m)return;
  var n=+m[1];
  if(e.key==='ArrowRight'&&CH[n+1])location.hash='#/c/'+(n+1);
  if(e.key==='ArrowLeft'&&CH[n-1])location.hash='#/c/'+(n-1);
});
</script>
