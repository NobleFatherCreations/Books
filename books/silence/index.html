BODIES[1]=`
<p>You searched for something and it was hard to find. That is not an accident and it is not because your situation is rare.</p>
<p>Most of what exists on this subject is written for someone else. It assumes a reader who is a woman, or it is written by people who want to use your situation to make an argument about someone else's, or it does not exist at all in a form you could hand to a friend without an explanation attached.</p>
<p>You looked anyway. That is worth noting, briefly, before the book gets on with it.</p>
<h3>What this book is</h3>
<p>Forty-six chapters, written plainly, for a man in a relationship where he is being controlled, isolated, frightened, or hurt. It will tell you what that looks like, why almost nobody asked, what actually exists to help you, and what to do.</p>
<p>It will not ask you to prove anything before it helps you.</p>
<h3>What it is not</h3>
<p>It is not going to spend its time arguing that men have it worse than women, or the same, or that the whole subject is secretly about men after all. Chapter three says the position once and the book does not come back to it.</p>
<p>It is also not a way in to anything else. There is no community here, no forum, no figure to follow, nothing being sold. By the time you reach chapter six you will understand exactly why that sentence needed saying this early.</p>
<div class="pull">You are not required to have tried everything else first. You are not required to be sure yet. Read the parts that are true and skip the ones that aren't.</div>
<h3>If something is happening right now</h3>
<p>Chapter seventeen is about calling the police, and it is honest about the risk of doing that badly. If someone is in immediate danger, that risk is smaller than the danger. Call.</p>
<p>Otherwise, start where it hurts. The book does not require order.</p>
`;

BODIES[2]=`
<p>You will hear a number, from someone, at some point, and it will be presented as settled. It is not settled, and the reason is not political. It is that this is a genuinely hard thing to measure.</p>
<h3>Why it's hard</h3>
<p>Men under-report this at higher rates than women do, for reasons this book spends several chapters on: shame, disbelief, the fear of not being taken seriously. That alone skews any survey built on reported incidents.</p>
<p>Definitions differ between studies. Some count only physical violence; some count coercive control; some count being on the receiving end of a single slap during an argument the same as a sustained campaign over years. Change the definition and the number moves substantially.</p>
<p>And the studies that exist are frequently read through a lens before anyone gets to the data: people who want the number to be large, and people who want it to be small, for reasons that have nothing to do with you.</p>
<div class="pull">Serious researchers disagree about the scale of this. That disagreement is real and it does not resolve by shouting a number more confidently.</div>
<h3>Why it doesn't matter to you</h3>
<p>Whatever the true prevalence is \u2014 common, uncommon, somewhere in between \u2014 it is happening to you or it isn't, and that is answered by your own life, not by a percentage.</p>
<p>You do not need a number to be large before your experience is real. You do not need to be part of a big enough group before you're allowed to ask for help. This is true of every other harm this library describes and it is true here.</p>
<h3>What to do when someone quotes a number at you</h3>
<p>In either direction \u2014 to minimise you, or to recruit you into treating your situation as proof of a wider grievance \u2014 the same answer works: <em>maybe. I don't know the research well enough to argue about it. I know what's happening in my house.</em></p>
<p>That sentence ends most conversations that were about to go somewhere unhelpful.</p>
`;

BODIES[3]=`
<p>One sentence, and then the book does not return to it.</p>
<div class="pull">This book exists alongside the book for women in this library. Not instead of it.</div>
<h3>What that means, exactly</h3>
<p>It is not a claim that men and women experience this equally, or that the services built for women are unnecessary, or that attention paid to your situation should come at the expense of attention paid to hers.</p>
<p>It is a claim about you, specifically, in your specific relationship, tonight. You need help. This book is trying to give you some. That is the whole content of its existence.</p>
<h3>Why this has to be said once, plainly</h3>
<p>Because there is a version of this conversation that some people want to have \u2014 whose suffering is worse, whose statistics are being suppressed, who the real victims are \u2014 and having it helps nobody in a kitchen tonight.</p>
<p>It also, not incidentally, is exactly the argument some people would like you to have on their behalf, because a man in genuine pain who can be recruited into that argument is useful to them in a way that has nothing to do with helping him. Chapter six is about that specifically.</p>
<h3>If someone tries to use this book against services for women</h3>
<p>They are doing something this book does not do and would not endorse. You can say so.</p>
<p><em>&ldquo;This book helped me. It also says plainly that it doesn't replace anything, and that women's services matter. I'm not going to use my situation to argue against someone else's help.&rdquo;</em></p>
<p>That is the position. It will not satisfy someone looking for a fight. It is not written for them.</p>
`;

BODIES[4]=`
<p>Most men who reach for help in this situation try three doors before they try a fourth, if they try a fourth at all. It is worth knowing what usually happens at each, so a bad result at one does not read as proof that none of them work.</p>
<h3>The friend</h3>
<p>You told someone. Maybe carefully, maybe it came out sideways during a different conversation.</p>
<p>The common response is not cruelty. It is disbelief delivered lightly: a joke, a raised eyebrow, a &ldquo;come on&rdquo; that treats the idea as inherently funny. Chapter twenty-five is about exactly this moment and what it does.</p>
<h3>The service</h3>
<p>You called a domestic-abuse line, or looked one up. Many of these were built, for good historical reasons, around a female caller, and the intake process sometimes has no obvious place for what you're describing. You may have been redirected, or asked questions that didn't fit, or simply not known what to say to be taken seriously.</p>
<p>This has been changing. Not everywhere, not evenly, but chapter twenty-six covers what's actually there now and how to get a better result.</p>
<h3>The police</h3>
<p>You called, or thought about calling, and the fear of what happens next stopped you, or you did call and something went wrong. Chapter fifteen and seventeen cover this in detail, because it is a real risk and it is not the whole story.</p>
<div class="pull">One closed door is information about that door. It is not information about the other three, and it is not information about you.</div>
<h3>Why this chapter exists</h3>
<p>Because a single bad experience at any of these tends to generalise \u2014 <em>nobody will believe me, there's no point trying again</em> \u2014 and that generalisation is doing more damage than the original bad experience did.</p>
<p>The rest of movement three and movement five are about doing this better: what to say, what to document first, and which specific version of each door is more likely to actually help.</p>
`;

BODIES[5]=`
<p>Before you say anything to anyone, it helps to know what you might hear back, not because it's true, but because it lands harder when you're not expecting it.</p>
<h3>The three that come up most</h3>
<p><strong>&ldquo;This is just MRA stuff.&rdquo;</strong> Meaning: this is a front for an ideology that resents women, dressed up as a personal story. It is worth being able to hold both things. That this ideology exists and does exactly that, and that your situation is real regardless of who else has misused similar language.</p>
<p><strong>&ldquo;You're making excuses.&rdquo;</strong> As though naming what happened to you is an attempt to excuse something you did. It usually isn't, and the accusation tends to arrive fastest from people who haven't heard the specifics yet.</p>
<p><strong>&ldquo;You're probably the real problem.&rdquo;</strong> The assumption, sometimes stated and sometimes just felt, that a man describing being controlled or hurt by a partner must be minimising his own conduct. Chapter thirty-seven takes this question seriously rather than dismissing it, but taking it seriously is different from assuming it as a starting point.</p>
<div class="pull">Anticipating an accusation is not the same as being guilty of it. Knowing it's coming just means it doesn't get to surprise you.</div>
<h3>What this chapter is not for</h3>
<p>It is not a licence to treat every skeptical response as one of these three. Some scepticism is reasonable, some questions deserve real answers, and not everyone who hesitates is dismissing you.</p>
<p>The point is narrower: when one of these three specific things is said, you don't have to spend the next hour wondering if it's true. You can recognise it, note that it's the predictable response rather than a verdict, and decide whether this is a person worth continuing the conversation with.</p>

<p>You searched for something and it was hard to find, and you kept looking anyway. That's most of what got you here. It's most of what gets anyone through the part that comes next, too.</p>
<p>What to do with the rest of it: chapter forty-four is the one to re-read when a week goes badly and you want to know whether what your body is doing is normal. Chapter thirty-one is the one to re-read before anything formal. Chapter thirty is where the help is.</p>
<p>The rest is yours, in whatever order it turns out you need it.</p>
